<script>
(() => {
'use strict';
/* =====================================================================
   COIN DROP: a low-poly 3D undersea coin pusher (Live Bait themed).
   Tap to drop a coin where you aim, hold to keep pouring.
   Coins pushed off the FRONT edge are yours; the side gutters keep them.
   Power-up tokens: Coin Shower, Giant Coin, Walls. Sea collectibles fill the album.
   Tiny built-in WebGL2 renderer (instanced, flat-shaded) + custom coin physics.
   World units: coin radius = 1. y is up, the player looks toward -z.
   ===================================================================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1));

const FONT="'Arial Rounded MT Bold','Nunito','Segoe UI Black','Segoe UI',system-ui,-apple-system,sans-serif";

/* ---------- playfield dimensions ---------- */
const TW=6;            // table half-width
const FRONT=7;         // front edge z (coins past here are won)
const BACK=-16;        // back of the pusher
const PUSH_TOP=1.25;   // height of the pusher's top deck
const WALL_Z=-10;      // back wall that scrapes coins off the pusher deck
const RAIL_END=1.5;    // side rails run from the back to here; beyond are the gutters
const DROP_Y=6.2,DROP_Z=-8.2;
const G=34;            // gravity

/* ---------- canvases ---------- */
const cv=document.getElementById('gl'),hud=document.getElementById('hud'),hx=hud.getContext('2d');
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
let W=0,H=0,DPR=1,T=0;
const SAFE={t:0,r:0,b:0,l:0},safeEl=document.getElementById('safe');
const isTouch=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
function readSafe(){const cs=getComputedStyle(safeEl);SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;}
function viewRect(){const vv=window.visualViewport;if(vv&&vv.width>0&&vv.height>0)return{w:vv.width,h:vv.height,x:vv.offsetLeft,y:vv.offsetTop};return{w:innerWidth,h:innerHeight,x:0,y:0};}
function resize(){
  const r=viewRect(),nw=Math.round(r.w),nh=Math.round(r.h);readSafe();
  for(const c of[cv,hud]){c.style.width=nw+'px';c.style.height=nh+'px';c.style.transform=`translate(${Math.round(r.x)}px,${Math.round(r.y)}px)`;}
  const nd=Math.min(window.devicePixelRatio||1,2);
  if(nw===W&&nh===H&&nd===DPR)return;
  W=nw;H=nh;DPR=nd;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);hud.width=Math.floor(W*DPR);hud.height=Math.floor(H*DPR);
  setupCamera();
}
if(!gl){document.body.innerHTML='<p style="color:#fff;font:18px sans-serif;padding:24px">Sorry, this browser does not support WebGL 2, which Coin Drop needs.</p>';return;}

/* =====================================================================
   MATH
   ===================================================================== */
function perspective(fovy,aspect,near,far){const f=1/Math.tan(fovy/2),nf=1/(near-far);return[f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0];}

// model matrix: translate * (tilt about horizontal axis at angle phi) * rotY(yaw) * scale
const MM=new Float32Array(16);
function model(x,y,z,yaw,phi,tilt,sx,sy,sz){
  const cy=Math.cos(yaw),sy_=Math.sin(yaw);
  // Ry
  const a00=cy,a02=sy_,a20=-sy_,a22=cy;
  // tilt rotation (Rodrigues around u=(cos phi,0,sin phi))
  const ux=Math.cos(phi),uz=Math.sin(phi),c=Math.cos(tilt),s=Math.sin(tilt),t=1-c;
  // full Rodrigues for u=(ux,0,uz)
  const m00=c+t*ux*ux, m01=-s*uz, m02=t*ux*uz;
  const m10=s*uz,      m11=c,     m12=-s*ux;

  // combined = Rtilt * Ry
  const b00=m00*a00+m02*a20, b01=m01, b02=m00*a02+m02*a22;
  const b10=m10*a00+m12*a20, b11=m11, b12=m10*a02+m12*a22;
  const b20=m20*a00+m22*a20, b21=m21, b22=m20*a02+m22*a22;
  MM[0]=b00*sx;MM[1]=b10*sx;MM[2]=b20*sx;MM[3]=0;
  MM[4]=b01*sy;MM[5]=b11*sy;MM[6]=b21*sy;MM[7]=0;
  MM[8]=b02*sz;MM[9]=b12*sz;MM[10]=b22*sz;MM[11]=0;

/* =====================================================================

const WHITE=[1,1,1];

function box(g,x0,y0,z0,x1,y1,z1,col,top,mode){

  g.quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],0,C);         // front (+z)
  g.quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],0,C);         // back
  g.quad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],0,C);         // right
  g.quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],0,C);         // left
}
function coinGeo(g,r,h,seg,col){

    ring(y1,ri,y1+.035,ri+.03,.5,.6);ring(y1+.035,ri+.03,y1-cb*.3,r,.6,.9);ring(y1-cb*.3,r,y0+cb*.3,r,.9,.1);ring(y0+cb*.3,r,y0-.035,ri+.03,.1,.4);ring(y0-.035,ri+.03,y0,ri,.4,.5);
  }
}
function cylinder(g,r,h,seg,capMode,sideMode,col){
  const y0=-h/2,y1=h/2;
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2,c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
    const U=(c,s)=>[.5+.49*c,.5+.49*s];
    g.tri([0,y1,0],[r*c1,y1,r*s1],[r*c0,y1,r*s0],[.5,.5],U(c1,s1),U(c0,s0),capMode,col,[0,1,0]);
    g.tri([0,y0,0],[r*c0,y0,r*s0],[r*c1,y0,r*s1],[.5,.5],U(c0,-s0),U(c1,-s1),capMode,col,[0,-1,0]);
    const u0=i/seg*6,u1=(i+1)/seg*6;   // rim texture repeats 6 times around
    g.tri([r*c0,y0,r*s0],[r*c1,y1,r*s1],[r*c1,y0,r*s1],[u0,0],[u1,1],[u1,0],sideMode,col);
    g.tri([r*c0,y0,r*s0],[r*c0,y1,r*s0],[r*c1,y1,r*s1],[u0,0],[u0,1],[u1,1],sideMode,col);
  }
}
// extrude a star-shaped 2D outline (pts around the origin) to a slab of thickness h (y up)
function extrude(g,pts,h,col,colTop){
  const y0=-h/2,y1=h/2,n=pts.length,z=[0,0];
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];
    g.tri([0,y1,0],[b[0],y1,b[1]],[a[0],y1,a[1]],z,z,z,0,colTop||col,[0,1,0]);
    g.tri([0,y0,0],[a[0],y0,a[1]],[b[0],y0,b[1]],z,z,z,0,col,[0,-1,0]);
    g.quad([a[0],y0,a[1]],[b[0],y0,b[1]],[b[0],y1,b[1]],[a[0],y1,a[1]],0,col);}
}
function icosphere(g,r,col,jitter,mode){
  const t=(1+Math.sqrt(5))/2;let V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(v=>{const l=Math.hypot(...v);return v.map(c=>c/l);});

  const mid={},M=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;if(mid[k]!=null)return mid[k];const p=V[a].map((c,i)=>(c+V[b][i])/2),l=Math.hypot(...p);V.push(p.map(c=>c/l));return mid[k]=V.length-1;};

function starPts(n,ro,ri){const p=[];for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2-Math.PI/2,r=i%2?ri:ro;p.push([Math.cos(a)*r,Math.sin(a)*r]);}return p;}

/* =====================================================================
   SHADERS
   ===================================================================== */
const VS=`#version 300 es
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNor;layout(location=2) in vec2 aUv;layout(location=3) in float aMode;layout(location=4) in vec3 aCol;
layout(location=5) in vec4 iM0;layout(location=6) in vec4 iM1;layout(location=7) in vec4 iM2;layout(location=8) in vec4 iM3;
layout(location=9) in vec3 iCol;layout(location=10) in vec3 iEx;
uniform mat4 uVP;
out vec3 vN;out vec3 vW;out vec2 vUv;flat out float vMode;out vec3 vCol;flat out vec3 vEx;
void main(){mat4 M=mat4(iM0,iM1,iM2,iM3);vec4 w=M*vec4(aPos,1.0);vW=w.xyz;vN=mat3(M)*aNor;vUv=aUv;vMode=aMode;vCol=aCol*iCol;vEx=iEx;gl_Position=uVP*w;}`;
const FS=`#version 300 es
precision highp float;
in vec3 vN;in vec3 vW;in vec2 vUv;flat in float vMode;in vec3 vCol;flat in vec3 vEx;
uniform sampler2D uAtlas;uniform sampler2D uBack;uniform vec3 uCam;uniform float uTime;uniform vec3 uFog;uniform vec2 uTile;
out vec4 o;
// fake studio environment for metal reflections: bright soft-boxes above, teal sea below
vec3 env(vec3 r){
  float up=r.y*0.5+0.5;
  vec3 c=mix(vec3(0.22,0.2,0.16),vec3(1.0,0.94,0.8),smoothstep(0.2,0.85,up));
  c+=vec3(1.0,0.95,0.82)*smoothstep(0.82,0.97,up)*1.4;                              // overhead light bar
  c+=vec3(1.0,0.82,0.55)*pow(max(dot(r,normalize(vec3(-0.5,0.55,0.7))),0.0),18.0)*1.6; // warm key soft-box
  c+=vec3(0.45,0.9,1.0)*pow(max(dot(r,normalize(vec3(0.7,0.4,-0.5))),0.0),10.0)*0.8;  // cool rim
  return c;}
void main(){
  if(vMode>4.5&&vMode<5.5){float rr=length(vUv-0.5)*2.0;float a=(1.0-smoothstep(0.35,1.0,rr))*vCol.r;o=vec4(0.0,0.03,0.06,a);return;}
  vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;
  vec3 V=normalize(uCam-vW);
  vec3 base=vCol;float shine=vEx.z;bool metal=false;
  if(vMode>0.5&&vMode<1.5){base=texture(uAtlas,vEx.xy+clamp(vUv,0.01,0.99)*uTile).rgb;metal=true;}
  else if(vMode>1.5&&vMode<2.5){base=texture(uAtlas,vec2(0.75,0.0)+vec2(fract(vUv.x),clamp(vUv.y,0.02,0.98))*uTile).rgb*vCol;metal=true;}
  else if(vMode>5.5){vec3 t=texture(uBack,vec2(vUv.x,1.0-vUv.y)).rgb;o=vec4(pow(t*1.05,vec3(0.95)),1.0);return;}
  vec3 L=normalize(vec3(-0.35,1.0,0.55));

    vec3 r=reflect(-V,n);float fres=0.55+0.45*pow(1.0-max(dot(n,V),0.0),4.0);

    col+=vec3(1.0,0.96,0.85)*pow(max(dot(reflect(-L,n),V),0.0),60.0)*0.9;             // sharp glint
  }else{
    vec3 amb=mix(vec3(0.16,0.26,0.36),vec3(0.42,0.58,0.72),n.y*0.5+0.5);
    col=base*(amb+vec3(1.0,0.95,0.85)*diff*0.85);
    col+=vec3(1.0,0.95,0.8)*pow(max(dot(reflect(-L,n),V),0.0),24.0)*shine;
    col+=base*pow(1.0-max(dot(n,V),0.0),3.0)*0.25*shine;

    vec2 p=vW.xz*0.55;float c=sin(p.x*2.1+uTime*1.3)+sin(p.y*2.7-uTime*1.1)+sin((p.x+p.y)*1.7+uTime*0.9)+sin(length(p+vec2(sin(uTime*.3),0.))*3.0-uTime*1.6);

  o=vec4(pow(col,vec3(0.94)),1.0);}`;
const BG_VS=`#version 300 es
layout(location=0) in vec2 aP;out vec2 vP;void main(){vP=aP;gl_Position=vec4(aP,0.999,1.0);}`;
const BG_FS=`#version 300 es
precision highp float;in vec2 vP;uniform float uTime;out vec4 o;
void main(){vec3 top=vec3(0.03,0.18,0.33),bot=vec3(0.05,0.36,0.47);float y=vP.y*0.5+0.5;vec3 c=mix(bot,top,y);

  float r=sin(vP.x*6.0+uTime*0.25+y*3.0)*0.5+0.5;r*=sin(vP.x*13.0-uTime*0.18)*0.5+0.5;c+=vec3(0.1,0.25,0.3)*r*smoothstep(0.2,1.0,y)*0.35;

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}

/* ---------- meshes with instance buffers ---------- */
const IF=22; // floats per instance: 16 matrix + 3 colour + 3 extra (uv offset, shine)
function Mesh(g,cap){

const COLLECT=['pearl','star','shell','gfish','crab','chest'];
let bodies=[],nextId=1;
function makeBody(kind,x,y,z,face){

let pushZ=-7.5,pushPrev=-7.5,pushT=0,wallsT=0,wallsK=0;

     killing downward speed. Processed bottom-to-top so stacks settle in one pass.
   - Sideways: only coins at the same height push each other, with a small "slop" so
     resting neighbours don't jitter, and inelastic impulses (nothing bounces apart).
   - Friction drags a resting coin toward the speed of whatever it sits on, so piles

const grid=new Map(),CELL=2.4;

  buildGrid();

        const dx=b.x-a.x,dz=b.z-a.z,rs=a.r+b.r;if(dx>rs||dx<-rs||dz>rs||dz<-rs)return;

      b.y=top+b.h/2;if(b.vy<0)b.vy=0;b.sup=sup;b.supB=supB;

      const k=Math.min(1,dt*(sup===3?10:7));b.vx+=(tx-b.vx)*k;b.vz+=(tz-b.vz)*k;

      if(sup===3&&supD>.3){const dx=b.x-supB.x,dz=b.z-supB.z,d=Math.hypot(dx,dz)||1,f=(supD-.3)*16*dt;b.vx+=dx/d*f;b.vz+=dz/d*f;}

const SAVE='coinDrop.';

let aimX=0,aimTarget=0,holding=false,holdT=0,lastDrop=-9,showers=[],floaters=[],banners=[],btns=[],albumOpen=false,newFind=null,hintT=0,trayPulse=0,bankPulse=0;
function saveMeta(){try{localStorage.setItem(SAVE+'meta',JSON.stringify({bank,won,dropped,album,muted}));}catch(e){}}
function saveField(){try{localStorage.setItem(SAVE+'field',JSON.stringify(bodies.filter(b=>!b.state&&b.y>-.5).map(b=>[b.kind,+b.x.toFixed(2),+b.y.toFixed(2),+b.z.toFixed(2),b.face]).slice(0,600)));}catch(e){}saveMeta();}
function loadField(){try{const a=JSON.parse(localStorage.getItem(SAVE+'field')||'null');if(!a||!a.length)return false;for(const[k,x,y,z,f]of a)if(KIND[k])makeBody(k,x,y+.02,z,f);return true;}catch(e){return false;}}
function prefill(){
  // a tidy, slightly jittered bed of coins, two layers deep, so the machine starts full
  for(let L=0;L<3;L++){const off=L%2?1.02:0;for(let z=-3.6+off*.5;z<FRONT-1.2;z+=2.08)for(let x=-TW+1.05+off;x<TW-1;x+=2.08){if(L===2&&Math.random()<.55)continue;
    const b=makeBody('coin',x+rand(-.12,.12),.17+L*.36+.02,z+rand(-.12,.12));b.py=b.y;}}
  for(const[k,x,z]of[['star',-2.5,3],['pearl',2.2,4.4],['shell',.5,1],['shower',-1.2,4.6],['walls',3.2,2]]){const b=makeBody(k,x,1.6,z);b.py=b.y;}
  for(let z=-8.9;z<pusherAt(0)-1;z+=2.08)for(let x=-TW+1.05;x<TW-1;x+=2.08){const b=makeBody('coin',x+rand(-.1,.1),PUSH_TOP+.19,z);b.py=b.y;}

}
let muteFx=false;
function pickDropKind(){
  const q=Math.random();
  if(q<.045){let t=COLLECT.reduce((s,k)=>s+KIND[k].w,0),r=Math.random()*t;for(const k of COLLECT){r-=KIND[k].w;if(r<=0)return k;}}

}
function dropCoin(free,kind,x){
  if(!free){if(bank<=0){sfx('empty');return;}bank--;dropped++;bankPulse=1;}
  const b=makeBody(kind||(free?'coin':pickDropKind()),x!=null?x:aimX+rand(-.08,.08),DROP_Y+rand(0,.5),DROP_Z+rand(-.35,.35));
  b.tilt=rand(.2,.6);b.phi=rand(0,6.28);b.spin=0;b.vy=-2;b.vz=rand(.2,.8);

let chuteKick=0;
function onFall(b,isWon){
  if(muteFx)return;

    trayPulse=1;
    if(b.kind==='coin'||b.kind==='giant'){won+=k.val;bank+=k.val;bankPulse=1;floaters.push({x:b.x,z:FRONT+.8,t:0,txt:'+'+k.val,col:'#ffe066',big:k.val>1});sfx(k.val>1?'jackpot':'win');}

function trigger(kind){

  if(kind==='giantTok'){banners.push({txt:'GIANT COIN!',sub:'worth 15',t:0,col:'#e7a8ff'});setTimeout(()=>{dropCoin(true,'giant',rand(-2,2));sfx('drop');},500);}

   AUDIO (pure ASMR: chinks, clinks, soft underwater hum)
   ===================================================================== */
let AC=null,master=null,clinkBudget=0;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
    // underwater ambience: low filtered noise + slow swell
    const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*.995+(Math.random()*2-1)*.05;d[i]=l;}
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=AC.createGain();g.gain.value=.55;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.08;lg.gain.value=.25;lfo.connect(lg).connect(g.gain);lfo.start();s.connect(f).connect(g).connect(master);s.start();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function setMute(m){muted=m;if(master)master.gain.value=m?0:.8;saveMeta();}
function tone(f,dur,type,vol,delay,f2){if(!AC)return;const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.003);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(master);o.start(t0);o.stop(t0+dur+.05);}
function noise(dur,vol,freq,delay,type,q){if(!AC)return;const t0=AC.currentTime+(delay||0),n=Math.max(1,Math.floor(AC.sampleRate*dur)),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;if(q)f.Q.value=q;
  const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(master);s.start(t0);}
// metallic coin clink: inharmonic partials with a fast decay
function clink(vol,delay,pitch){if(!AC)return;const f=(pitch||1)*rand(2600,3900);const t0=AC.currentTime+(delay||0);
  for(const[r,v,d]of[[1,1,.18],[2.71,.55,.11],[5.18,.3,.06],[1.48,.35,.14]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*r;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol*v*.18,t0+.002);g.gain.exponentialRampToValueAtTime(.0001,t0+d*rand(.8,1.3));o.connect(g).connect(master);o.start(t0);o.stop(t0+.3);}
  noise(.02,vol*.25,6000,delay,'highpass');}
function impact(b,speed){if(muteFx||!AC||clinkBudget<=0)return;clinkBudget--;const v=clamp(speed/22,.15,1)*(b.kind==='giant'?1.4:1);
  if(KIND[b.kind].col&&b.kind!=='chest'){tone(rand(900,1300),.08,'triangle',.08*v);return;}
  if(b.kind==='giant'){clink(v,0,.55);tone(160,.25,'sine',.25*v,0,90);return;}
  clink(v,0,b.kind==='coin'?1:.85);if(Math.random()<.4)clink(v*.5,rand(.03,.08));}
function sfx(n){
  if(!AC||muted||muteFx)return;
  if(n==='drop'){noise(.12,.12,1800,0,'bandpass',.8);tone(520,.06,'sine',.05,0,380);}
  if(n==='win'){for(let i=0;i<3;i++)clink(.7-i*.15,i*.05+rand(0,.02),1.05);}
  if(n==='jackpot'){for(let i=0;i<8;i++)clink(.8,i*.05,rand(.9,1.2));[0,4,7,12].forEach((s,i)=>tone(784*Math.pow(2,s/12),.3,'triangle',.08,.1+i*.07));}
  if(n==='collect'){[0,7,12,16].forEach((s,i)=>tone(660*Math.pow(2,s/12),.35,'sine',.1,i*.06));noise(.5,.06,7000,.05,'highpass');}
  if(n==='power'){[0,4,7,12,16,19].forEach((s,i)=>tone(523*Math.pow(2,s/12),.3,'triangle',.09,i*.05));}
  if(n==='gutter'){tone(300,.15,'sine',.05,0,180);}
  if(n==='empty')tone(220,.12,'square',.05,0,160);
  if(n==='refill'){for(let i=0;i<14;i++)clink(.6,i*.035,rand(.95,1.15));}
  if(n==='bubble')tone(rand(500,900),.12,'sine',.03,0,rand(1100,1600));
  if(n==='ui')tone(820,.05,'sine',.08);
}
function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p);}catch(e){}}

document.addEventListener('gesturestart',e=>e.preventDefault());

/* =====================================================================
   LOOP
   ===================================================================== */
let acc=0,last=performance.now(),saveT=0,thumbsDone=false,bubbleT=2;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  hintT+=dt;bankPulse=Math.max(0,bankPulse-dt*4);trayPulse=Math.max(0,trayPulse-dt*3);chuteKick=Math.max(0,chuteKick-dt*6);
  aimX=lerp(aimX,aimTarget,Math.min(1,dt*14));
  if(holding){holdT+=dt;if(T-lastDrop>.22&&holdT>.25){dropCoin(false);lastDrop=T;}}
  if(wallsT>0)wallsT=Math.max(0,wallsT-dt);
  for(let i=showers.length-1;i>=0;i--){showers[i]-=dt;if(showers[i]<=0){showers.splice(i,1);const b=makeBody('coin',rand(-TW+1.2,TW-1.2),DROP_Y+rand(0,3),rand(-8,0));b.tilt=rand(.2,.8);b.py=b.y;if(Math.random()<.5)clink(.25,0,1.2);}}
  clinkBudget=Math.min(clinkBudget+dt*30,6);
  acc+=dt;let n=0;while(acc>=1/120&&n<4){physStep(1/120);fallStep(1/120);acc-=1/120;n++;}if(n>=4)acc=0;
  for(const f of floaters)f.t+=dt;floaters=floaters.filter(f=>f.t<1.1);
  if(banners.length&&!newFind){banners[0].t+=dt;if(banners[0].t>=2.3)banners.shift();}
  if(newFind){newFind.t+=dt;if(newFind.t>3.1)newFind=null;}
  bubbleT-=dt;if(bubbleT<=0){bubbleT=rand(2,5);sfx('bubble');}
  saveT+=dt;if(saveT>8){saveT=0;saveField();}
  if(!thumbsDone){makeThumbs();thumbsDone=true;}
  renderScene();drawHUD();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
let fitQ=false;const queueFit=()=>{if(fitQ)return;fitQ=true;requestAnimationFrame(()=>{fitQ=false;resize();});};
addEventListener('resize',queueFit);addEventListener('orientationchange',()=>{queueFit();setTimeout(resize,300);});
if(window.visualViewport){visualViewport.addEventListener('resize',queueFit);visualViewport.addEventListener('scroll',queueFit);}
setInterval(()=>{const r=viewRect();if(Math.round(r.w)!==W||Math.round(r.h)!==H)resize();},500);
addEventListener('scroll',()=>{if(window.scrollY||window.scrollX)window.scrollTo(0,0);},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveField();});addEventListener('pagehide',saveField);
resize();gl.clearColor(.05,.3,.45,1);
if(!loadField())prefill();else{muteFx=true;for(let i=0;i<120;i++)physStep(1/120);muteFx=false;bodies=bodies.filter(b=>!b.state);}
requestAnimationFrame(frame);
})();
</script>
</body>
