  const P=[];let seg=1;for(let q=0;q<N;q++){const d=q*L/N;while(seg<loop.length-1&&cum[seg]<d)seg++;const a=loop[seg-1],b=loop[seg],sl=cum[seg]-cum[seg-1]||1,t=(d-cum[seg-1])/sl;P.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
  const ang=(a,b,c)=>{const ux=b[0]-a[0],uy=b[1]-a[1],vx=c[0]-b[0],vy=c[1]-b[1];return Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy);};
  let cx=0,cy=0;for(const p of P){cx+=p[0];cy+=p[1];}cx/=N;cy/=N;
  let total=0;for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N];let d=Math.atan2(b[1]-cy,b[0]-cx)-Math.atan2(a[1]-cy,a[0]-cx);while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;total+=d;}

  cand.sort((a,b)=>turn[b]-turn[a]);const corners=[];
  for(const c of cand)if(corners.every(o=>Math.min(Math.abs(o-c),N-Math.abs(o-c))>=5))corners.push(c);

  let mr=0;const rs=P.map(p=>Math.hypot(p[0]-cx,p[1]-cy));for(const r of rs)mr+=r;mr/=N;let vr=0;for(const r of rs)vr+=(r-mr)**2;const round=Math.sqrt(vr/N)/mr;

  let res=null;

  else if(wind>.7&&wind<1.35&&round<.085&&sharp===0&&size<130)res='circle';
  else if(corners.length===3&&wind>.7&&wind<1.35&&triFill>.78&&triFill<1.3)res='tri';
  return res?{shape:res,cx,cy,size}:null;
}

const BOMB_FUSE=1.8,BLAST=165,CANNON_V=1050,CANNON_A=55*Math.PI/180;
let shake=0;
function spawnBomb(x,y,ink){const b=makeBody([{x,y,r:20}],{mass:.9,kind:'bomb',mu:.8});b.fuse=BOMB_FUSE;b.ink=ink;b.sec=curSec;b.col='#2c2438';strokes.push(b);sfx('magic');magicPuff(x,y,'#ff7f50');flash('BOMB!','#ff7f50');return b;}
function spawnCannon(x,y,ink){
  const beads=[];for(let dx=-42;dx<=42;dx+=12)beads.push({x:x+dx,y:y+14,r:10});for(let dx=-24;dx<=24;dx+=12)beads.push({x:x+dx,y:y-6,r:10});
  const c=makeBody(beads,{fixedRot:true,mass:4,kind:'cannon',mu:1});c.dir=x>=player.x?1:-1;c.queue=0;c.cool=0;c.ink=ink;c.sec=curSec;c.recoil=0;strokes.push(c);
  sfx('magic');magicPuff(x,y,'#ffd23f');flash('CANNON! Draw little circles above it','#ffd23f');return c;}
function cannonMuzzle(c){const a=c.dir>0?-CANNON_A:-(Math.PI-CANNON_A),px=c.x,py=c.y1-32;return{x:px+Math.cos(a)*56,y:py+Math.sin(a)*56,a};}
function nearCannon(x,y){for(const b of bodies)if(b.kind==='cannon'&&Math.abs(x-b.x)<110&&y<b.y1&&y>b.y1-340)return b;return null;}
function fire(c){const m=cannonMuzzle(c),ball=makeBody([{x:m.x,y:m.y,r:14}],{mass:1.2,kind:'ball',mu:.5});
  ball.vx=Math.cos(m.a)*CANNON_V;ball.vy=Math.sin(m.a)*CANNON_V;ball.ignore=c;ball.igT=.35;ball.life=7;c.recoil=1;shake=Math.max(shake,.35);sfx('cannon');buzz(30);
  for(let i=0;i<12;i++)parts.push({x:m.x,y:m.y,vx:Math.cos(m.a)*rand(80,300)+rand(-80,80),vy:Math.sin(m.a)*rand(80,300)+rand(-80,80),life:rand(.3,.6),max:.6,r:rand(6,12),c:i%2?'#fff':'#c9c0d6',kind:'dot'});}
function breakWall(s){if(!s.on)return;s.on=false;s.broken=true;sfx('crash');buzz([30,20,40]);shake=Math.max(shake,.6);
  for(let i=0;i<40;i++)parts.push({x:s.x+rand(0,s.w),y:rand(Math.max(s.y,camY),s.y+s.h),vx:rand(-320,320),vy:rand(-500,-60),life:rand(.6,1.1),max:1.1,r:rand(6,14),c:['#b9a690','#9c8a74','#cfc0aa'][i%3],kind:'conf',rot:rand(0,6),vr:rand(-9,9)});}
function explode(b){b.gone=true;sfx('boom');buzz([60,30,80]);shake=1;
  for(let i=0;i<46;i++){const a=rand(0,6.28),sp=rand(120,620);parts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:rand(.4,.9),max:.9,r:rand(6,14),c:['#ff7f50','#ffd23f','#ff6fb1','#fff1a8'][i%4],kind:'dot'});}
  parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.45,max:.45,r:BLAST,c:'#fff1a8',kind:'ring'});
  for(const s of statics)if(s.style==='crack'&&s.on){const qx=clamp(b.x,s.x,s.x+s.w),qy=clamp(b.y,s.y,s.y+s.h);if(Math.hypot(b.x-qx,b.y-qy)<BLAST)breakWall(s);}
  for(const o of bodies){if(o===b||o.gone)continue;const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy)||1;if(d>BLAST*1.25)continue;
    if(o===player){if(d<115)killPlayer('boom');else{o.vx+=dx/d*420;o.vy-=260;}continue;}
    if(o.kind==='rock'){o.dead=true;continue;}const k=(1-d/(BLAST*1.25))*900;o.vx+=dx/d*k;o.vy+=dy/d*k-200;o.w+=rand(-6,6)*(o.invI?1:0);}
}
function magicPuff(x,y,col){for(let i=0;i<22;i++){const a=rand(0,6.28),sp=rand(60,260);parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.4,.8),max:.8,r:rand(4,8),c:i%3?col:'#fff',kind:'conf',rot:rand(0,6),vr:rand(-8,8)});}}

/* ---------- drawing strokes ---------- */
const BR=9;
// a stroke may not go through walls, Anikol or other crayon lines. Rocks don't block it (they get crushed).
function blocked(x,y){
  if(y<BR||y>VH)return true;
  for(const s of statics){if(!s.on)continue;const sy=s.y+(s.dy||0);const qx=clamp(x,s.x,s.x+s.w),qy=clamp(y,sy,sy+s.h);if((x-qx)**2+(y-qy)**2<(BR+1.5)**2)return true;}
  for(const b of bodies){if(b.kind==='rock')continue;if(x<b.x0-BR-2||x>b.x1+BR+2||y<b.y0-BR-2||y>b.y1+BR+2)continue;for(const d of b.beads){if((x-d.wx)**2+(y-d.wy)**2<(d.r+BR+2)**2)return true;}}
  return false;
}
function startStroke(x,y){if(inkLeft<8||deadT>=0||winT>=0)return;if(blocked(x,y)){flash('Not there!');sfx('nope');return;}drawing={pts:[[x,y]],len:0,col:CRAYONS[crayonI%CRAYONS.length]};sfx('draw0');}
function extendStroke(x,y){
  if(!drawing)return;const p=drawing.pts[drawing.pts.length-1];let dx=x-p[0],dy=y-p[1],d=Math.hypot(dx,dy);if(d<5)return;
  const n=Math.ceil(d/5);for(let i=1;i<=n;i++){const qx=p[0]+dx*i/n,qy=p[1]+dy*i/n,q=drawing.pts[drawing.pts.length-1],sd=Math.hypot(qx-q[0],qy-q[1]);
    if(drawing.len+sd>inkLeft){endStroke();flash('Out of crayon!');return;}
    if(blocked(qx,qy)){endStroke();return;}
    drawing.pts.push([qx,qy]);drawing.len+=sd;}
  scribble(d);
  if(drawing&&((drawing.ck=(drawing.ck||0)+1)%2===0)){const r=recog(drawing.pts);drawing.magic=r?(r.shape==='circle'?(nearCannon(r.cx,r.cy)?'ball':null):r.shape):null;}
}
function endStroke(){
  const dr=drawing;drawing=null;scribble(0);if(!dr||dr.len<2)return;
  const mg=recog(dr.pts);
  if(mg){
    const spend=()=>{inkLeft-=dr.len;secUsed[curSec]+=dr.len;crayonI++;};
    if(mg.shape==='tri'){spend();spawnBomb(mg.cx,mg.cy,dr.len);return;}
    if(mg.shape==='star'){spend();spawnCannon(mg.cx,mg.cy,dr.len);return;}
    if(mg.shape==='circle'){const c=nearCannon(mg.cx,mg.cy);if(c){spend();c.queue++;if(c.cool<=0)c.cool=.45;sfx('load');magicPuff(mg.cx,mg.cy,'#c9c0d6');
      parts.push({x:mg.cx,y:mg.cy,vx:(c.x-mg.cx)*2,vy:(c.y1-60-mg.cy)*2,life:.45,max:.45,r:14,c:'#3b3448',kind:'dot'});return;}}
  }
  const beads=[],sp=BR*1.05;let acc=0;beads.push({x:dr.pts[0][0],y:dr.pts[0][1],r:BR});
  for(let i=1;i<dr.pts.length;i++){const a=dr.pts[i-1],b=dr.pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);let t=sp-acc;
    while(t<=l){beads.push({x:a[0]+(b[0]-a[0])*t/l,y:a[1]+(b[1]-a[1])*t/l,r:BR});t+=sp;}acc=l-(t-sp);}
  const last=dr.pts[dr.pts.length-1],lb=beads[beads.length-1];if(Math.hypot(last[0]-lb.x,last[1]-lb.y)>3)beads.push({x:last[0],y:last[1],r:BR});
  // any rock caught inside the new line crumbles
  for(const r of bodies)if(r.kind==='rock'&&!r.dead)for(const d of beads)if((r.x-d.x)**2+(r.y-d.y)**2<(20+BR)**2){r.dead=true;break;}
  const body=makeBody(beads,{col:dr.col,ink:dr.len,mu:.85});
  body.path=dr.pts.map(p=>[p[0]-body.x,p[1]-body.y]);body.sec=curSec;
  strokes.push(body);inkLeft-=dr.len;secUsed[curSec]+=dr.len;crayonI++;sfx('pop');
}
function undo(){if(drawing){drawing=null;slow=1;scribble(0);return;}
  const b=strokes[strokes.length-1];if(b&&b.kind==='cannon')b.queue=0;if(!b||b.sec!==curSec){flash('Can\u2019t undo past a checkpoint');return;}
  strokes.pop();bodies.splice(bodies.indexOf(b),1);inkLeft+=b.ink;secUsed[curSec]-=b.ink;sfx('undo');
  for(let i=0;i<10;i++)parts.push({x:b.x+rand(-30,30),y:b.y+rand(-20,20),vx:rand(-120,120),vy:rand(-200,-40),life:.5,max:.5,r:rand(4,8),c:b.col,kind:'dot'});}
function flash(t,col){flashMsg={t,a:1.6,col:col||'#ff7f50'};}

/* ---------- update ---------- */
function update(rdt){
  for(const p of parts){if(p.kind==='ring'){p.life-=rdt;continue;}p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.vy+=(p.kind==='conf'?900:1200)*rdt;if(p.kind==='conf'){p.vx*=.985;p.vy=Math.min(p.vy,240);p.rot+=p.vr*rdt;}p.life-=rdt;}
  parts=parts.filter(p=>p.life>0);
  if(flashMsg){flashMsg.a-=rdt;if(flashMsg.a<=0)flashMsg=null;}
  if(screen!=='play'||!L)return;
  if(deadT>=0){deadT+=rdt;if(deadT>1.1)respawn();}
  if(winT>=0)winT+=rdt;
  // time slows to a crawl while you draw, so you can sketch a roof under falling rocks
  slow+=((drawing?.22:1)-slow)*Math.min(1,rdt*10);const dt=rdt*slow;
  for(let i=0;i<L.rocks.length;i++){const z=L.rocks[i];if(deadT>=0||player.x<z[0]-700||player.x>z[1]+500)continue;
    rockTs[i]-=dt;if(rockTs[i]<=0){rockTs[i]=z[2];const r=makeBody([{x:rand(z[0],z[1]),y:Math.max(0,camY)-30,r:20}],{mass:.5,kind:'rock',mu:.6});r.vy=rand(150,300);r.spin=rand(-6,6);}}
  const sdt=dt/SUB;for(let i=0;i<SUB;i++)physStep(sdt);
  input.jumpEdge=false;
  if(shake>0)shake=Math.max(0,shake-rdt*2.5);
  for(const b of bodies){
    if(b.kind==='bomb'&&!b.gone){b.fuse-=dt;if(b.fuse<=0)explode(b);}
    if(b.kind==='cannon'){b.recoil=Math.max(0,b.recoil-dt*4);if(b.queue>0){b.cool-=dt;if(b.cool<=0){fire(b);b.queue--;b.cool=.7;}}}
    if(b.kind==='ball'&&!b.gone){b.life-=dt;b.igT-=dt;if(b.life<=0||b.y>VH+60)b.gone=true;
      for(const s of statics)if(s.style==='crack'&&s.on&&b.x+16>s.x&&b.x-16<s.x+s.w&&b.y+16>s.y&&b.y-16<s.y+s.h)breakWall(s);
      for(const t of targets)if(!t.hit&&Math.hypot(b.x-t.x,b.y-t.y)<t.r+16){t.hit=true;b.gone=true;sfx('bullseye');buzz([20,30,20]);flash('Bullseye!','#43b95a');
        for(let i=0;i<30;i++)parts.push({x:t.x,y:t.y,vx:rand(-360,360),vy:rand(-420,120),life:rand(.6,1),max:1,r:rand(5,10),c:CRAYONS[i%6],kind:'conf',rot:rand(0,6),vr:rand(-9,9)});}}
  }
  for(const b of bodies)if(b.kind==='rock'&&(b.dead||b.y>VH+100)){if(b.dead&&b.y<VH){sfx('crumble');for(let i=0;i<8;i++)parts.push({x:b.x,y:b.y,vx:rand(-200,200),vy:rand(-260,-40),life:rand(.3,.6),max:.6,r:rand(4,8),c:'#9a9aa6',kind:'dot'});}b.gone=true;}
  bodies=bodies.filter(b=>!b.gone);
  for(const b of strokes)if(b.y>VH+300&&!b.gone){b.gone=true;bodies.splice(bodies.indexOf(b),1);}
  strokes=strokes.filter(b=>!b.gone);
  if(player.ground){if(!lastGround&&airT>.15){landT=T;sfx('land');}airT=0;}else airT+=dt;lastGround=player.ground;
  walkDist+=Math.abs(player.vx)*dt*(player.ground?1:0);
  if(player.y>VH+80)killPlayer('fall');
  for(const s of L.spikes)if(player.x>s[0]-10&&player.x<s[0]+s[2]+10&&player.y+34>s[1]-24)killPlayer('spikes');
  // buttons hold doors open only while something is on them (Anikol counts too)
  for(const bt of buttons){let on=false;
    for(const b of bodies){if(b.kind==='rock'||b.x1<bt.x||b.x0>bt.x+bt.w||b.y1<bt.y-40||b.y0>bt.y)continue;for(const d of b.beads)if(d.wx>bt.x-4&&d.wx<bt.x+bt.w+4&&d.wy+d.r>bt.y-14&&d.wy<bt.y){on=true;break;}if(on)break;}
    if(on&&!bt.pressed){sfx('click');buzz(15);}bt.pressed=on;bt.p+=((on?1:0)-bt.p)*Math.min(1,dt*14);}
  for(let i=0;i<doors.length;i++){const d=doors[i],count=buttons.filter(b=>b.door===i&&b.pressed).length+targets.filter(t=>t.door===i&&t.hit).length,under=player.x>d.x-30&&player.x<d.x+d.w+30&&d.t>.3;
    const want=count>=d.needs||under;if(want&&!d.open)sfx('door');if(!want&&d.open)sfx('thud');d.open=want;
    d.t=clamp(d.t+(d.open?dt:-dt)/.6,0,1);d.dy=-easeOut(d.t)*(d.h-60);d.on=true;}
  // checkpoints & crayon boxes
  for(let i=0;i<L.cps.length;i++){const cp=L.cps[i];if(!cpReached[i]&&player.x>cp.x-25&&deadT<0){cpReached[i]=true;curSec=cp.sec;inkLeft=inkCap=L.secs[curSec].ink;
    sfx('refill');buzz([15,20,15]);flash('Checkpoint! Crayons refilled','#43b95a');
    for(let k=0;k<26;k++)parts.push({x:cp.x,y:FLOOR-30,vx:rand(-220,220),vy:rand(-520,-200),life:rand(.7,1.2),max:1.2,r:rand(5,9),c:CRAYONS[k%6],kind:'conf',rot:rand(0,6),vr:rand(-9,9)});}}
  if(Math.abs(player.x-L.goal[0])<46&&Math.abs(player.y-(L.goal[1]-40))<70)winLevel();
  const vw=W/K,tx=clamp(player.x-vw*.42,0,Math.max(0,L.w-vw));if(!drawing)camX+=(tx-camX)*Math.min(1,rdt*6);
  const ty=clamp(player.y-VIEWH*.64,0,VH-VIEWH);if(!drawing)camY+=(ty-camY)*Math.min(1,rdt*4);
}

   AUDIO

let AC=null,master=null,scrG=null,scrF=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
    const n=AC.sampleRate,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;scrF=AC.createBiquadFilter();scrF.type='bandpass';scrF.frequency.value=2600;scrF.Q.value=1.4;scrG=AC.createGain();scrG.gain.value=0;s.connect(scrF).connect(scrG).connect(master);s.start();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function setMute(m){muted=m;localStorage.setItem(SAVE+'mute',m?'1':'0');if(master)master.gain.value=m?0:.8;}
function tone(f,dur,type,vol,delay,f2){if(!AC)return;const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(master);o.start(t0);o.stop(t0+dur+.05);}
function noise(dur,vol,freq,delay,type){if(!AC)return;const t0=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(master);s.start(t0);}
function scribble(speed){if(!AC||!scrG)return;const t=AC.currentTime;scrG.gain.setTargetAtTime(muted||!speed?0:clamp(speed/40,.04,.22),t,.03);scrF.frequency.setTargetAtTime(1800+clamp(speed*40,0,2200),t,.05);}
function sfx(n){
  if(!AC||muted)return;
  if(n==='jump')tone(380,.18,'sine',.18,0,760);
  if(n==='land'){tone(140,.1,'sine',.2,0,80);noise(.06,.12,800);}
  if(n==='pop'){tone(520,.08,'triangle',.16,0,880);tone(880,.1,'sine',.08,.05,1320);}
  if(n==='draw0')tone(700,.04,'sine',.06);
  if(n==='undo')tone(600,.12,'triangle',.12,0,300);
  if(n==='nope')tone(220,.12,'square',.06,0,160);
  if(n==='click'){tone(1200,.04,'square',.08);tone(600,.08,'sine',.12,.02,400);}
  if(n==='door'){noise(.4,.12,500);tone(200,.35,'triangle',.1,0,380);}
  if(n==='thud'){noise(.2,.2,300);tone(110,.2,'sine',.15,0,60);}
  if(n==='crumble')noise(.18,.2,900);
  if(n==='refill'){[0,4,7,12].forEach((s,i)=>tone(660*Math.pow(2,s/12),.2,'triangle',.1,i*.06));noise(.3,.05,6000,0,'highpass');}
  if(n==='oops')[0,-3,-7].forEach((s,i)=>tone(520*Math.pow(2,s/12),.2,'triangle',.14,i*.13));
  if(n==='win'){[0,4,7,12,16,19,24].forEach((s,i)=>tone(523*Math.pow(2,s/12),.32,'triangle',.12,i*.07));noise(.8,.08,7000,.2,'highpass');}

const ICON={

 undo:(x,y,r)=>{ctx.strokeStyle=INK;ctx.lineWidth=r*.18;ctx.lineCap='round';ctx.beginPath();ctx.arc(x+r*.05,y+r*.08,r*.45,Math.PI*1.1,Math.PI*.35,false);ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(x-r*.62,y-r*.32);ctx.lineTo(x-r*.18,y-r*.42);ctx.lineTo(x-r*.48,y+r*.02);ctx.closePath();ctx.fill();},
 reset:(x,y,r)=>{ctx.strokeStyle=INK;ctx.lineWidth=r*.18;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y,r*.45,-.4,Math.PI*1.5);ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(x+r*.2,y-r*.75);ctx.lineTo(x+r*.62,y-r*.42);ctx.lineTo(x+r*.18,y-r*.18);ctx.closePath();ctx.fill();},
 left:(x,y,r)=>{ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(x-r*.5,y);ctx.lineTo(x+r*.35,y-r*.5);ctx.lineTo(x+r*.35,y+r*.5);ctx.closePath();ctx.fill();},
 right:(x,y,r)=>{ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(x+r*.5,y);ctx.lineTo(x-r*.35,y-r*.5);ctx.lineTo(x-r*.35,y+r*.5);ctx.closePath();ctx.fill();},
 jump:(x,y,r)=>{ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(x,y-r*.55);ctx.lineTo(x+r*.5,y+r*.15);ctx.lineTo(x+r*.18,y+r*.15);ctx.lineTo(x+r*.18,y+r*.5);ctx.lineTo(x-r*.18,y+r*.5);ctx.lineTo(x-r*.18,y+r*.15);ctx.lineTo(x-r*.5,y+r*.15);ctx.closePath();ctx.fill();},
 sound:(x,y,r)=>{ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(x-r*.5,y-r*.18);ctx.lineTo(x-r*.2,y-r*.18);ctx.lineTo(x+r*.12,y-r*.48);ctx.lineTo(x+r*.12,y+r*.48);ctx.lineTo(x-r*.2,y+r*.18);ctx.lineTo(x-r*.5,y+r*.18);ctx.closePath();ctx.fill();
   ctx.strokeStyle=INK;ctx.lineWidth=r*.12;ctx.lineCap='round';if(muted){ctx.beginPath();ctx.moveTo(x+r*.28,y-r*.25);ctx.lineTo(x+r*.6,y+r*.25);ctx.moveTo(x+r*.6,y-r*.25);ctx.lineTo(x+r*.28,y+r*.25);ctx.stroke();}else{ctx.beginPath();ctx.arc(x+r*.18,y,r*.32,-.8,.8);ctx.stroke();}},
};
let ctrlRects={};
function starShape(x,y,r,col){ctx.save();ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr2=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();}
function drawHUD(){
  const top=SAFE.t+8,L0=SAFE.l+10,R0=W-SAFE.r-10,bs=Math.max(40,Math.min(52,H*.12));
  paperBtn(L0,top,bs,bs,'#ffe08a','',()=>{screen='levels';drawing=null;slow=1;},ICON.back);
  fitText((levelI+1)+'. '+L.name,L0+bs+12,top+bs*.36,Math.min(20,H*.045),'#fff',W*.22,'left');
  // checkpoint dots: start, 3 crayon boxes, goal
  for(let i=0;i<=L.cps.length+1;i++){const x=L0+bs+20+i*20,y=top+bs*.78,done=i===0||i<=L.cps.length&&cpReached[i-1]||(i===L.cps.length+1&&winT>=0);
    ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fillStyle=done?'#43b95a':'rgba(255,255,255,.75)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();if(i<=L.cps.length){ctx.beginPath();ctx.moveTo(x+6,y);ctx.lineTo(x+14,y);ctx.stroke();}}
  paperBtn(R0-bs,top,bs,bs,'#bfe6f5','',()=>{loadLevel(levelI);sfx('ui');},ICON.reset);
  paperBtn(R0-bs*2-10,top,bs,bs,'#ffc6d3','',undo,ICON.undo);
  const iw=Math.min(W*.28,280),ix=W/2-iw/2,iy=top+bs*.22,ih=bs*.56,k=clamp(inkLeft/inkCap,0,1);
  ctx.save();rr(ix,iy,iw,ih,ih/2);ctx.fillStyle='#fff8e8';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();
  const col=CRAYONS[crayonI%CRAYONS.length];ctx.save();rr(ix,iy,iw,ih,ih/2);ctx.clip();ctx.fillStyle=col;ctx.fillRect(ix,iy,iw*k,ih);ctx.fillStyle=grain;ctx.fillRect(ix,iy,iw,ih);ctx.restore();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(ix+iw*k-2,iy+ih*.2);ctx.lineTo(ix+iw*k+ih*.5,iy+ih/2);ctx.lineTo(ix+iw*k-2,iy+ih*.8);ctx.closePath();if(k>0){ctx.fill();ctx.stroke();}ctx.restore();
  text(Math.round(inkLeft)+'',ix+ih*.9,iy+ih/2+1,ih*.5,'#fff','left');
  const u=inkUsedTotal(),st=u<=L.par[0]?3:u<=L.par[1]?2:1;for(let i=0;i<3;i++)starShape(ix+iw+18+i*22,iy+ih/2,9,i<st?'#ffd23f':'rgba(255,255,255,.4)');
  const sec=L.secs[curSec];
  if(sec.hint&&!strokes.some(s=>s.sec===curSec)&&deadT<0&&winT<0&&!drawing){ctx.save();ctx.globalAlpha=.92;fitText(sec.hint,W/2,top+bs+Math.min(28,H*.065),Math.min(21,H*.048),'#fff',W*.8);ctx.restore();}
  if(drawing){ctx.save();ctx.globalAlpha=.85;fitText('drawing… time slowed',W/2,top+bs+Math.min(28,H*.065),Math.min(18,H*.042),'#e0c8ff',W*.8);ctx.restore();}
  if(flashMsg){ctx.save();ctx.globalAlpha=clamp(flashMsg.a,0,1);fitText(flashMsg.t,W/2,H*.4,Math.min(34,H*.08),flashMsg.col,W*.85);ctx.restore();}
  ctrlRects={};
  if(isTouch){const r=Math.max(34,Math.min(46,H*.1)),by=H-SAFE.b-r-12;
    const pad=(id,x,icon,on)=>{ctx.save();ctx.globalAlpha=on?.95:.72;ctx.fillStyle='rgba(60,40,70,.25)';ctx.beginPath();ctx.arc(x+2,by+4,r,0,7);ctx.fill();ctx.fillStyle=on?'#fff6c2':'#fff8e8';ctx.beginPath();ctx.arc(x,by,r,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();icon(x,by,r);ctx.restore();ctrlRects[id]={x,y:by,r:r*1.25};};
    pad('l',SAFE.l+r+14,ICON.left,input.l);pad('r',SAFE.l+r*3+28,ICON.right,input.r);pad('j',W-SAFE.r-r-14,ICON.jump,input.jump);}
  if(deadT>=0){ctx.save();ctx.globalAlpha=clamp(deadT*3,0,1);text(deadWhy==='fall'?'Whoops!':deadWhy==='rock'?'Bonk!':deadWhy==='boom'?'Kaboom! Too close!':'Ouch!',W/2,H*.4,Math.min(56,H*.13),'#ff7f50');
    fitText('back to the last crayon box',W/2,H*.4+Math.min(44,H*.1),Math.min(18,H*.045),'#fff',W*.8);ctx.restore();}
  if(winT>.7)drawWin();
}
function card(w,h,col){const x=W/2-w/2,y=H/2-h/2;ctx.save();ctx.fillStyle='rgba(60,40,70,.3)';tornRect(x+8,y+10,w,h,6);ctx.fill();ctx.fillStyle=col;tornRect(x,y,w,h,6);ctx.fill();ctx.fillStyle=grain;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();return{x,y};}
function drawWin(){
  const a=clamp((winT-.7)/.3,0,1);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(60,40,70,.35)';ctx.fillRect(0,0,W,H);btns=[{x:0,y:0,w:W,h:H,fn:()=>{}}];
  const w=Math.min(440,W*.62),h=Math.min(H*.86,300),{x,y}=card(w,h,'#fff1a8');
  text('Level clear!',W/2,y+44,Math.min(40,H*.09),'#ff7f50');
  const u=inkUsedTotal(),now=u<=L.par[0]?3:u<=L.par[1]?2:1;
  for(let i=0;i<3;i++){const k=easeBack(clamp((winT-1-i*.25)/.35,0,1));starShape(W/2+(i-1)*70,y+h*.42,30*k,i<now?'#ffd23f':'#e8dcc0');}
  fitText('crayon used: '+Math.round(u)+'  ·  ★★★ under '+L.par[0],W/2,y+h*.62,Math.min(16,H*.04),'#fff',w*.9);
  const bh=Math.max(42,Math.min(52,H*.12)),bw=(w-60)/2;
  paperBtn(x+20,y+h-bh-20,bw,bh,'#bfe6f5','Replay',()=>loadLevel(levelI));
  if(levelI<LEVELS.length-1)paperBtn(x+40+bw,y+h-bh-20,bw,bh,'#7cc576','Next  ›',()=>loadLevel(levelI+1));
  else paperBtn(x+40+bw,y+h-bh-20,bw,bh,'#7cc576','All done!',()=>{screen='levels';});
  ctx.restore();
}
function bgCover(key){const im=IMG[key],m=A[key];if(!im||!im.complete)return;const s=Math.max(W/m.w,H/m.h),w=m.w*s,h=m.h*s;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);}
function drawTitle(){
  bgCover('bg_room');ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(0,0,W,H);
  const s=Math.min(W/900,H/420);
  ctx.save();ctx.translate(W*.36,H*.26);ctx.rotate(-.03);text("Anikol's",0,-s*48,s*30,'#ff7f50');text('CRAYON QUEST',0,0,s*66,'#ffd23f','center',s*12);ctx.restore();
  fitText('Draw your way to the star!',W*.36,H*.26+s*58,s*24,'#fff',W*.6);
  spr('p_draw',W*.78,H*.86,Math.min(H*.5,300),{sy:1+.015*Math.sin(T*3)});
  const bw=Math.min(240,W*.28),bh=Math.max(48,Math.min(64,H*.14));
  paperBtn(W*.36-bw/2,H*.5,bw,bh,'#7cc576','PLAY',()=>{initAudio();screen='levels';});
  paperBtn(W*.36-bw/2,H*.5+bh+14,bw*.48,bh*.78,'#ffc6d3','Library',()=>{location.href='index.html';});
  paperBtn(W*.36+bw*.02,H*.5+bh+14,bw*.48,bh*.78,'#bfe6f5','',()=>{initAudio();setMute(!muted);},ICON.sound);
}
function drawLevels(){
  bgCover('bg_yard');ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(0,0,W,H);
  const top=SAFE.t+10,bs=Math.max(40,Math.min(52,H*.12));
  paperBtn(SAFE.l+10,top,bs,bs,'#ffe08a','',()=>{screen='title';},ICON.back);
  text('Pick a level',W/2,top+bs/2,Math.min(34,H*.08),'#ffd23f');
  const n=LEVELS.length,cols=n<=4?n:Math.ceil(n/2),rows=Math.ceil(n/cols),gw=Math.min(W*.88,820),cw=gw/cols-16,ch=Math.min((H-top-bs-70)/rows-16,cw*.8),gx=W/2-gw/2,gy=top+bs+20;
  // magic shapes guide
  {const gy2=H-SAFE.b-Math.min(30,H*.07);fitText('Magic shapes:   △ = bomb    ☆ = cannon    ○ above a cannon = cannonball',W/2,gy2,Math.min(17,H*.04),'#fff',W*.92);}
  LEVELS.forEach((lv,i)=>{const x=gx+(i%cols)*(cw+16)+8,y=gy+Math.floor(i/cols)*(ch+16),open=i<prog.unlocked;
    ctx.save();ctx.fillStyle='rgba(60,40,70,.25)';tornRect(x+5,y+6,cw,ch,4);ctx.fill();ctx.fillStyle=open?['#ffc6d3','#bfe6f5','#fff1a8','#c9f0c0','#e3d0ff'][i%5]:'#d8d0dc';tornRect(x,y,cw,ch,4);ctx.fill();ctx.fillStyle=grain;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();
    text(String(i+1),x+cw/2,y+ch*.34,ch*.34,open?'#fff':'#bbb');
    if(open){fitText(lv.name,x+cw/2,y+ch*.64,Math.min(15,ch*.13),'#fff',cw*.9);const st=prog.stars[i]||0;for(let k=0;k<3;k++)starShape(x+cw/2+(k-1)*20,y+ch*.84,7,k<st?'#ffd23f':'rgba(255,255,255,.55)');
      btns.push({x,y,w:cw,h:ch,fn:()=>{initAudio();loadLevel(i);screen='play';}});}
    else{ctx.save();ctx.fillStyle=INK;ctx.globalAlpha=.5;rr(x+cw/2-10,y+ch*.64,20,16,4);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(x+cw/2,y+ch*.64,7,Math.PI,0);ctx.stroke();ctx.restore();}
  });
}
function drawRotate(){ctx.fillStyle='#a8d8ea';ctx.fillRect(0,0,W,H);btns=[{x:0,y:0,w:W,h:H,fn:()=>{}}];
  const s=Math.min(W,H)*.16;ctx.save();ctx.translate(W/2,H/2-s*.4);ctx.rotate(Math.sin(T*2)*.5+.6);rr(-s*.32,-s*.55,s*.64,s*1.1,s*.1);ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();
  fitText('Turn your phone sideways',W/2,H/2+s*.75,Math.min(26,W*.06),'#fff',W*.9);}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);btns=[];
  if(loaded<total){ctx.fillStyle='#a8d8ea';ctx.fillRect(0,0,W,H);text('Sharpening crayons… '+Math.round(loaded/total*100)+'%',W/2,H/2,22,'#fff');return;}
  if(!grain)makeGrain();
  if(portraitBlock()){drawRotate();return;}
  if(screen==='title'){drawTitle();return;}
  if(screen==='levels'){drawLevels();return;}
  drawWorld();drawHUD();
}

/* ---------- input ---------- */
const ptrs=new Map(),keys={};
function toWorld(sx,sy){return[sx/K+camX,sy/K+camY];}
function ctrlAt(x,y){for(const id in ctrlRects){const c=ctrlRects[id];if(Math.hypot(x-c.x,y-c.y)<c.r)return id;}return null;}
function setCtrl(){const v=[...ptrs.values()];input.l=v.includes('l')||!!keys.l;input.r=v.includes('r')||!!keys.r;const j=v.includes('j')||!!keys.j;if(j&&!input.jump)input.jumpEdge=true;input.jump=j;}
cv.addEventListener('pointerdown',e=>{
  initAudio();const x=e.clientX,y=e.clientY;
  for(let k=btns.length-1;k>=0;k--){const b=btns[k];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sfx('ui');b.fn();return;}}
  if(screen!=='play'||portraitBlock())return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const c=isTouch?ctrlAt(x,y):null;
  if(c){ptrs.set(e.pointerId,c);setCtrl();return;}
  if(drawing)return;
  if(y<SAFE.t+Math.max(40,Math.min(52,H*.12))+12)return;
  ptrs.set(e.pointerId,'draw');const w=toWorld(x,y);startStroke(w[0],w[1]);
});
cv.addEventListener('pointermove',e=>{const m=ptrs.get(e.pointerId);if(m==='draw'&&drawing){const w=toWorld(e.clientX,e.clientY);extendStroke(w[0],w[1]);}
  else if(m&&m!=='draw'&&isTouch){const c=ctrlAt(e.clientX,e.clientY);if(c&&c!==m){ptrs.set(e.pointerId,c);setCtrl();}}});
function up(e){const m=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(m==='draw'&&drawing)endStroke();setCtrl();}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowleft','arrowright','arrowdown'].includes(k))e.preventDefault();if(e.repeat)return;initAudio();
  if(k==='a'||k==='arrowleft')keys.l=1;if(k==='d'||k==='arrowright')keys.r=1;if(k==='w'||k==='arrowup'||k===' ')keys.j=1;
  if(k==='z')undo();if(k==='r'&&screen==='play')loadLevel(levelI);if(k==='m')setMute(!muted);setCtrl();});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=0;if(k==='d'||k==='arrowright')keys.r=0;if(k==='w'||k==='arrowup'||k===' ')keys.j=0;setCtrl();});
addEventListener('blur',()=>{ptrs.clear();for(const k in keys)keys[k]=0;if(drawing)endStroke();setCtrl();});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- boot ---------- */
let fitQ=false;const queueFit=()=>{if(fitQ)return;fitQ=true;requestAnimationFrame(()=>{fitQ=false;resize();});};
addEventListener('resize',queueFit);addEventListener('orientationchange',()=>{queueFit();setTimeout(resize,300);});
if(window.visualViewport){visualViewport.addEventListener('resize',queueFit);visualViewport.addEventListener('scroll',queueFit);}
setInterval(()=>{const r=viewRect();if(Math.round(r.w)!==W||Math.round(r.h)!==H)resize();},500);
addEventListener('scroll',()=>{if(window.scrollY||window.scrollX)window.scrollTo(0,0);},{passive:true});
try{window.screen.orientation&&window.screen.orientation.lock&&window.screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
resize();
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;acc+=dt;
  let n=0;while(acc>=1/60&&n<3){update(1/60);acc-=1/60;n++;}if(n>=3)acc=0;
  draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
