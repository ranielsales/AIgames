<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090e">
<title>Game Shelf</title>
<style>
:root{--vvh:100dvh;--accent:#b8ff34;--accent2:#ff536e;--ink:#07090e;--muted:#9aa3b7;--panel:#111722}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
body{height:var(--vvh)}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:
 radial-gradient(circle at 12% 18%,rgba(184,255,52,.12),transparent 28%),
 radial-gradient(circle at 88% 72%,rgba(255,83,110,.12),transparent 31%),
 linear-gradient(135deg,#05070b,#0b101a 50%,#06080d);transition:.45s ease}
body.family:before{background:radial-gradient(circle at 16% 18%,rgba(70,226,255,.18),transparent 30%),radial-gradient(circle at 84% 78%,rgba(255,208,58,.12),transparent 30%),linear-gradient(135deg,#05080d,#081621 52%,#05080d)}
#app{position:relative;height:var(--vvh);min-height:420px;display:grid;grid-template-rows:auto 1fr auto;padding:max(20px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;z-index:4}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.18em;font-size:clamp(13px,2vw,17px)}
.brand-mark{width:32px;height:32px;border:2px solid #fff;border-radius:10px;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--accent);font-size:18px}
.library-count{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(250px,560px) minmax(260px,520px);align-items:center;justify-content:center;gap:clamp(28px,6vw,90px);perspective:1300px}
.carousel{height:min(69vh,690px);min-height:360px;position:relative;display:grid;place-items:center;touch-action:none}
.card{--x:0;--z:0;--r:0;--scale:1;position:absolute;height:min(66vh,650px);max-height:calc(var(--vvh) - 165px);aspect-ratio:2/3;border-radius:clamp(22px,3vw,36px);overflow:hidden;background:#111;box-shadow:0 35px 80px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.12);transform:translate3d(calc(var(--x)*1px),0,calc(var(--z)*1px)) rotateY(calc(var(--r)*1deg)) scale(var(--scale));transition:transform .55s cubic-bezier(.2,.8,.18,1),opacity .45s,filter .45s;cursor:pointer;will-change:transform;backface-visibility:hidden}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 42%,rgba(2,4,8,.05) 58%,rgba(2,4,8,.92) 100%);pointer-events:none}
.card img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.015);transition:transform .7s ease}
.card.active:hover img{transform:scale(1.055)}
.card:not(.active){filter:saturate(.65) brightness(.58);opacity:.58;pointer-events:auto}
.poster-copy{position:absolute;z-index:2;left:8%;right:8%;bottom:5.8%;text-shadow:0 3px 18px #000}
.poster-title{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(38px,6vw,76px);line-height:.82;letter-spacing:.02em;transform:skew(-3deg);-webkit-text-stroke:1px rgba(0,0,0,.35)}
.poster-edition{margin-top:12px;display:inline-block;background:var(--accent);color:#0a0c10;border:3px solid #080a0e;padding:7px 11px;border-radius:8px;font-size:clamp(10px,1.35vw,14px);font-weight:1000;letter-spacing:.08em;transform:rotate(-2deg);box-shadow:4px 4px 0 rgba(0,0,0,.75)}
.card.family .poster-edition{background:#51e3ff}
.card.gross .poster-title{letter-spacing:.035em;transform:rotate(-2deg) skew(-5deg)}
.card.active:before{content:"";position:absolute;z-index:3;inset:0;border:3px solid rgba(255,255,255,.72);border-radius:inherit;pointer-events:none}
.details{position:relative;z-index:3;align-self:center;max-width:520px;transition:.25s ease}
.eyebrow{color:var(--accent);font-size:12px;font-weight:1000;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
.details h1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(42px,7vw,86px);line-height:.86;margin:0;letter-spacing:.01em;text-transform:uppercase}
.details h2{font-size:clamp(16px,2.2vw,24px);line-height:1;margin:14px 0 22px;color:#d7ddeb;text-transform:uppercase;letter-spacing:.08em}
.details p{margin:0 0 28px;color:#aeb7c9;font-size:clamp(14px,1.5vw,18px);line-height:1.55;max-width:46ch}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play{appearance:none;border:0;background:var(--accent);color:#080a0e;border-radius:14px;padding:15px 25px;font:900 15px/1 system-ui;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 9px 24px rgba(184,255,52,.2);cursor:pointer;transition:.18s transform,.18s box-shadow}
body.family .play{background:#51e3ff;box-shadow:0 9px 24px rgba(81,227,255,.22)}
.play:hover{transform:translateY(-2px);box-shadow:0 13px 30px rgba(184,255,52,.28)}
.play:active{transform:translateY(1px) scale(.98)}
.arrow{appearance:none;width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:24px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px);transition:.18s}
.arrow:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.dots{display:flex;gap:8px;margin-top:24px}
.dot{width:8px;height:8px;border-radius:20px;border:0;padding:0;background:#495064;transition:.35s;cursor:pointer}
.dot.active{width:30px;background:var(--accent)}
footer{z-index:5;display:flex;align-items:center;justify-content:space-between;color:#717b90;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.key-help{display:flex;gap:17px;align-items:center}.key{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 7px;border:1px solid rgba(255,255,255,.14);border-radius:7px;color:#adb6c8;background:rgba(255,255,255,.05);margin-right:6px;font-size:12px}
.deck-label{color:#596276}
.swipe-hint{display:none}
@media(max-width:780px){
 #app{grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
 .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:8px;padding-top:6px}
 .carousel{height:auto;min-height:0;align-self:stretch}
 .card{height:min(59vh,560px);max-height:calc(var(--vvh) - 280px);min-height:300px}
 .details{text-align:center;align-self:start;max-width:100%;padding:0 4px}
 .eyebrow,.details p{display:none}.details h1{display:none}.details h2{font-size:13px;margin:8px 0 12px}.actions{justify-content:center}.play{padding:13px 22px}.dots{justify-content:center;margin:14px 0 0}
 footer{margin-top:8px}.key-help{display:none}.swipe-hint{display:block}.brand{font-size:12px}.brand-mark{width:29px;height:29px}.library-count{font-size:10px}
}
@media(max-width:430px){.card{height:min(57vh,510px)}.arrow{width:44px;height:44px}.poster-title{font-size:45px}.poster-edition{font-size:10px}}
@media(max-height:570px) and (orientation:landscape){
 #app{padding-top:10px;padding-bottom:10px}.stage{grid-template-columns:minmax(190px,350px) minmax(270px,440px);grid-template-rows:1fr;gap:34px}.carousel{height:calc(var(--vvh) - 90px)}.card{height:calc(var(--vvh) - 110px);min-height:280px}.details{text-align:left}.details h1{display:block;font-size:45px}.details h2{font-size:13px}.details p{display:block;font-size:13px;margin-bottom:14px}.actions{justify-content:flex-start}.dots{justify-content:flex-start;margin-top:12px}footer{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
 <header>
   <div class="brand"><span class="brand-mark">◆</span><span>GAME SHELF</span></div>
   <div class="library-count"><span id="count">2</span> games installed</div>
 </header>
 <main class="stage">
   <section class="carousel" id="carousel" aria-label="Game carousel"></section>
   <section class="details" id="details" aria-live="polite">
     <div class="eyebrow" id="eyebrow"></div>
     <h1 id="title"></h1>
     <h2 id="edition"></h2>
     <p id="desc"></p>
     <div class="actions">
       <button class="arrow" id="prev" aria-label="Previous game">‹</button>
       <button class="play" id="play">Play game</button>
       <button class="arrow" id="next" aria-label="Next game">›</button>
     </div>
     <div class="dots" id="dots"></div>
   </section>
 </main>
 <footer>
   <div class="key-help"><span><b class="key">←</b><b class="key">→</b>Browse</span><span><b class="key">Enter</b>Play</span></div>
   <div class="swipe-hint">Swipe to browse · Tap poster to play</div>
   <div class="deck-label">Local game library</div>
 </footer>
</div>

ly","badge":"FAMILY"}];
let index=Math.max(0,Math.min(GAMES.length-1,+(localStorage.getItem('gameShelfSelected')||0)));
const carousel=document.getElementById('carousel'),dots=document.getElementById('dots');
const E={body:document.body,title:document.getElementById('title'),edition:document.getElementById('edition'),desc:document.getElementById('desc'),eyebrow:document.getElementById('eyebrow')};

function build(){
 GAMES.forEach((g,i)=>{
   const card=document.createElement('article');card.className=`card ${g.theme}`;card.dataset.i=i;card.tabIndex=0;
   card.innerHTML=`<img src="${g.poster}" alt="${g.title}: ${g.edition} poster"><div class="poster-copy"><div class="poster-title">${g.title}</div><div class="poster-edition">${g.edition}</div></div>`;
   card.addEventListener('click',()=>{if(i===index)play();else select(i)});
   card.addEventListener('keydown',e=>{if(e.key==='Enter'){if(i===index)play();else select(i)}});
   carousel.appendChild(card);
   const d=document.createElement('button');d.className='dot';d.ariaLabel=`Select ${g.edition}`;d.onclick=()=>select(i);dots.appendChild(d);
 });
 document.getElementById('count').textContent=GAMES.length;select(index,false);
}
function circularDelta(i){let d=i-index;const n=GAMES.length;if(d>n/2)d-=n;if(d<-n/2)d+=n;return d}
function select(i,animate=true){
 index=(i+GAMES.length)%GAMES.length;localStorage.setItem('gameShelfSelected',index);
 [...carousel.children].forEach((card,j)=>{
   const d=circularDelta(j),side=Math.sign(d),abs=Math.abs(d),mobile=innerWidth<=780;
   const spread=mobile?Math.min(145,innerWidth*.30):Math.min(230,innerWidth*.2);
   card.style.setProperty('--x',d*spread);card.style.setProperty('--z',abs?-160*abs:40);card.style.setProperty('--r',side*-13);card.style.setProperty('--scale',abs?Math.max(.72,1-abs*.17):1);
   card.style.zIndex=20-abs;card.classList.toggle('active',j===index);card.setAttribute('aria-hidden',j===index?'false':'true');
 });
 [...dots.children].forEach((d,j)=>d.classList.toggle('active',j===index));
 const g=GAMES[index];E.body.className=g.theme;E.title.textContent=g.title;E.edition.textContent=g.edition;E.desc.textContent=g.desc;E.eyebrow.textContent=g.tag;
 document.documentElement.style.setProperty('--accent',g.theme==='gross'?'#b8ff34':'#51e3ff');
}
function play(){location.href=GAMES[index].href}
function next(dir=1){select(index+dir)}
document.getElementById('prev').onclick=()=>next(-1);document.getElementById('next').onclick=()=>next(1);document.getElementById('play').onclick=play;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();next(-1)}if(e.key==='ArrowRight'){e.preventDefault();next(1)}if(e.key==='Enter'&&!e.repeat){e.preventDefault();play()}});
let sx=0,sy=0,dx=0,dragging=false;
carousel.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;dx=0;dragging=true;try{carousel.setPointerCapture(e.pointerId)}catch(_){}});
carousel.addEventListener('pointermove',e=>{if(!dragging)return;dx=e.clientX-sx;if(Math.abs(dx)>8)e.preventDefault()});
function endSwipe(){if(!dragging)return;dragging=false;if(Math.abs(dx)>45)next(dx<0?1:-1)}
carousel.addEventListener('pointerup',endSwipe);carousel.addEventListener('pointercancel',endSwipe);
carousel.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)+Math.abs(e.deltaY)<5)return;e.preventDefault();next((e.deltaX||e.deltaY)>0?1:-1)},{passive:false});
function fit(){const vv=visualViewport;const h=vv?vv.height:innerHeight;document.documentElement.style.setProperty('--vvh',Math.round(h)+'px');select(index,false)}
addEventListener('resize',fit);if(visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}
build();fit();
</script>
