function colAt(d){
  if(d<=0)return COLSTOPS[0][1];
  for(let i=0;i<COLSTOPS.length-1;i++){
    const a=COLSTOPS[i],b=COLSTOPS[i+1];
    if(d<b[0]){const t=(d-a[0])/(b[0]-a[0]);const A=hex2rgb(a[1]),B=hex2rgb(b[1]);
      return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}
  }
  return COLSTOPS[COLSTOPS.length-1][1];
}

}

  if(vv&&vv.width>0&&vv.height>0)return{w:vv.width,h:vv.height,x:vv.offsetLeft,y:vv.offsetTop};
  return{w:window.innerWidth,h:window.innerHeight,x:0,y:0};
}
function resize(){
  const r=viewRect(),nw=Math.round(r.w),nh=Math.round(r.h);
  readSafe();
  cv.style.width=nw+'px';cv.style.height=nh+'px';
  cv.style.transform=`translate(${Math.round(r.x)}px,${Math.round(r.y)}px)`;
  if(nw===W&&nh===H&&cv.width===Math.floor(nw*DPR))return;
  const oldW=W||nw;
  DPR=Math.min(window.devicePixelRatio||1,2);W=nw;H=nh;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  S=clamp(Math.min(W/1000,H/700),.55,1.2);initSnow();
  hx=clamp((hx||oldW/2)*W/oldW,24*S,W-24*S);ax=ax*W/oldW;   // keep the worm in the same relative spot
  if(dragTarget!==null)dragTarget=hx;
}
let fitQueued=false;
function queueFit(){if(fitQueued)return;fitQueued=true;requestAnimationFrame(()=>{fitQueued=false;resize();});}

if(window.visualViewport){visualViewport.addEventListener('resize',queueFit);visualViewport.addEventListener('scroll',queueFit);}

document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(resize,50);});
setInterval(()=>{const r=viewRect();if(Math.round(r.w)!==W||Math.round(r.h)!==H)resize();},500); // safety net for missed events

// fullscreen (hides the address bar entirely where the browser allows it, e.g. Android Chrome)
const canFS=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){
  const el=document.documentElement;
  try{
    if(isFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});
      if(p&&p.then)p.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{});}catch(e){}}).catch(()=>{});}
  }catch(e){}
}
function drawFSButton(){
  fsBtn=null;
  if(!isTouch||!canFS)return;
  const r=17,x=W-SAFE.r-12-r,y=SAFE.t+12+r;fsBtn={x,y,r};
  ctx.save();ctx.fillStyle='rgba(0,20,40,.45)';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.2;ctx.lineCap='round';const a=6,b=11,s=isFS()?-1:1;
  for(const[sx,sy]of[[-1,-1],[1,-1],[-1,1],[1,1]]){
    const cx=x+sx*(s>0?b:a),cy=y+sy*(s>0?b:a),dx=-sx*5*s,dy=-sy*5*s;
    ctx.beginPath();ctx.moveTo(cx+dx,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+dy);ctx.stroke();}
  ctx.restore();
}

function initSnow(){snow=Array.from({length:Math.round(W*H/9000)},()=>({x:rand(0,W),y:rand(0,H),r:rand(.6,2.2),p:rand(.25,1),tw:rand(0,6.28)}));}

/* ---------- audio ---------- */
let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f1,f2,dur,type,vol,delay){
  if(!AC||muted)return;const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);
  g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.05);
}
function noise(dur,vol,freq,delay){
  if(!AC||muted)return;const t0=AC.currentTime+(delay||0);
  const len=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq,t0);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t0);
}
function sfx(n){
  if(n==='whoosh'){noise(.45,.25,2200);}
  if(n==='splash'){noise(.6,.45,900);tone(500,90,.3,'sine',.15);}
  if(n==='chomp'){tone(240,40,.28,'square',.18);noise(.18,.35,700);tone(120,30,.4,'sawtooth',.12,.08);}
  if(n==='zone'){tone(523,523,.25,'sine',.12);tone(784,784,.4,'sine',.12,.15);}
  if(n==='rumble'){tone(70,28,1.4,'sawtooth',.16);noise(1.2,.2,200);}
  if(n==='slice'){noise(.25,.35,7000);tone(1400,260,.22,'sawtooth',.1);tone(900,1800,.12,'triangle',.08,.05);}
  if(n==='unlock'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.25,'triangle',.12,i*.09));}
  if(n==='ready'){tone(880,1320,.15,'triangle',.1);}
  if(n==='empty'){tone(300,140,.22,'square',.07);}
  if(n==='deny'){tone(200,150,.12,'square',.06);}
  if(n==='ninja'){[392,523,659,880,1175].forEach((f,i)=>tone(f,f*1.02,.18,'square',.07,i*.05));noise(.5,.15,4000);}
  if(n==='swish'){noise(.15,.18,5000);}
  if(n==='slice2'){noise(.12,.25,6500);tone(1600,400,.14,'sawtooth',.07);}
  if(n==='punch'){tone(180,50,.3,'square',.2);noise(.22,.5,1200);tone(90,40,.35,'sine',.25);}
  if(n==='drill'){tone(70,180,1.2,'sawtooth',.09);noise(1.3,.18,2600);tone(400,1200,.5,'square',.04,.1);}
  if(n==='hum'){tone(110+Math.random()*30,150,.35,'sawtooth',.035);noise(.3,.05,3500);}
  if(n==='pickup'){[660,880,1175,1568].forEach((f,i)=>tone(f,f,.16,'triangle',.11,i*.06));}
  if(n==='land'){tone(200,60,.4,'square',.14);noise(.4,.35,1500);}
  if(n==='yoink'){tone(160,1100,.55,'sawtooth',.13);noise(.9,.2,1500,.1);}
}
function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}

/* ---------- input: keyboard ---------- */
function action(){
  initAudio();
  if(state==='title')startIntro();
  else if(state==='intro'&&introT>.3)startPlay();
  else if(state==='dead'){
    if(!reelDone&&deathT>.6){reelStarted=true;deathT=Math.max(deathT,REEL_END);}   // skip the yoink
    else if(reelDone&&deathT>REEL_END+.8)startIntro();
  }
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
  keys[k]=true;
  if(k==='m'&&!e.repeat){muted=!muted;}
  if((k===' '||k==='enter')&&!e.repeat)action();
  if((k==='w'||k==='arrowup')&&!e.repeat)trySlice();
  if((k==='e'||k==='arrowdown')&&!e.repeat)tryNinja();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{keys={};ptrs.clear();dragTarget=null;touchBoost=false;});

/* ---------- input: touch / mouse gestures ----------
   Drag (hold & move)  -> steer. The hook follows your finger's sideways movement, wherever you touch.
   Drag down while held-> burst (sink faster) for as long as you hold it down.
   Quick tap           -> Worm Slice.
   Two-finger tap      -> Worm Ninja. While it's active the world slows down and your finger is the blade.
   Tap a skill icon    -> use that skill.                                                              */
const ptrs=new Map();let primary=null;
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')isTouch=true;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  mx=e.clientX;my=e.clientY;initAudio();
  if(fsBtn&&Math.hypot(mx-fsBtn.x,my-fsBtn.y)<fsBtn.r+10){toggleFS();return;}
  if(state!=='play'){action();return;}
  for(const h of iconHits)if(Math.hypot(mx-h.x,my-h.y)<h.r+10){h.act();return;}
  const now=performance.now();
  const p={id:e.pointerId,x0:mx,y0:my,x:mx,y:my,t0:now,hx0:hx,moved:false,used:false};
  ptrs.set(e.pointerId,p);
  if(ninjaT>0){slicing=true;trail=[{x:mx,y:my,t:T}];sfx('swish');p.used=true;return;}
  // two-finger tap: a second finger lands quickly while the first hasn't moved
  if(ptrs.size===2){
    const first=[...ptrs.values()].find(q=>q!==p);
    if(first&&!first.moved&&now-first.t0<TWO_FINGER_MS){
      first.used=p.used=true;if(primary===first.id){primary=null;dragTarget=null;}
      tryNinja();return;
    }
  }
  if(primary===null)primary=e.pointerId;
});
cv.addEventListener('pointermove',e=>{
  const px=mx,py=my;mx=e.clientX;my=e.clientY;
  const p=ptrs.get(e.pointerId);
  if(slicing&&ninjaT>0){trail.push({x:mx,y:my,t:T});ninjaCut(px,py,mx,my);return;}
  if(!p||p.used||state!=='play')return;
  p.x=mx;p.y=my;
  if(!p.moved&&Math.hypot(p.x-p.x0,p.y-p.y0)>DRAG_START){p.moved=true;p.x0=p.x;p.hx0=hx;}   // re-anchor so there's no jump
  if(p.moved&&e.pointerId===primary){
    dragTarget=clamp(p.hx0+(p.x-p.x0)*DRAG_GAIN,24*S,W-24*S);
    touchBoost=(p.y-p.y0)>BURST_DRAG;
    // if the finger runs past the edge, re-anchor so dragging back responds immediately
    if(dragTarget<=24*S||dragTarget>=W-24*S){p.x0=p.x;p.hx0=dragTarget;}
  }
});
function ptrEnd(e){
  const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);
  if(e.pointerId===primary){primary=null;dragTarget=null;touchBoost=false;}
  if(ptrs.size===0){slicing=false;if(isTouch){mx=-99;my=-99;}}
  if(!p||p.used||state!=='play')return;
  const quick=performance.now()-p.t0<TAP_MS&&Math.hypot(e.clientX-p.x0,e.clientY-p.y0)<TAP_PX&&!p.moved;
  if(quick)trySlice(true);
}
cv.addEventListener('pointerup',ptrEnd);
cv.addEventListener('pointercancel',ptrEnd);
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});   // stop pull-to-refresh / page bounce

/* ---------- flow ---------- */
function resetRun(){
  depth=0;fish=[];hvx=0;hx=W/2;spawnAcc=0;nextGap=H*.45;zoneIdx=0;banner=null;killer=null;
  flash=0;shake=0;bubbles=[];drops=[];ripples=[];splashed=false;castSnd=false;levWarned=false;newBest=false;
  stam=1;exhausted=false;boosting=false;speedNow=3.7;viewDepth=0;
  sliceOn=false;sliceReady=0;slicePinged=true;sliceFx=0;parts=[];sparks=[];
  reelStarted=false;reelDone=false;reelFrom=null;
  ninjaOn=false;ninjaReady=0;ninjaPinged=true;ninjaT=0;slicing=false;trail=[];
  threat=0;flinch=0;mood='worm';moodPop=0;denyT=0;
  runDrills=0;drilling=false;drillCuts=0;pickups=[];floaters=[];bannerQ=[];
  punchOn=false;punchReady=0;punchPinged=true;invuln=0;pows=[];flung=[];iconHits=[];
  ptrs.clear();primary=null;dragTarget=null;touchBoost=false;
}
function showBanner(b){if(drilling)bannerQ.push(b);else banner=b;}
function startIntro(){state='intro';introT=0;drillBank=+(localStorage.getItem('wormHookDrills')||0);resetRun();}
function startPlay(){
  state='play';hx=W/2;hvx=0;ax=introTipX||W*.35;hintT=0;
  depth=(HY()+30*S)/(PPM*S);viewDepth=depth;speedNow=3.7;
  banner={text:ZONES[0][1],sub:isTouch?'Drag to steer. Dodge the fish.':'Dodge the fish. Sink deep.',t:0};
  // spend every banked Worm Drill: drill straight down to drills × DRILL_M metres
  drillTarget=drillBank*DRILL_M;drillUsed=drillBank;
  if(drillTarget>depth+5){drilling=true;drillStart=depth;drillHum=0;sfx('drill');buzz([40,30,40]);
    banner={text:'WORM DRILL ×'+drillBank,sub:'Drilling down to '+drillTarget+' m',t:0,skill:true,col:'#ffc23a'};}
  drillBank=0;localStorage.setItem('wormHookDrills','0');
  // first pickup is the next multiple of DRILL_EVERY past where the drill stops (no free pickups while drilling)
  nextDrillAt=(Math.floor(Math.max(depth,drillTarget)/DRILL_EVERY)+1)*DRILL_EVERY;
}
function drillLand(){
  drilling=false;invuln=1.2;sliceFx=1;shake=Math.max(shake,.5);sfx('land');buzz(60);
  const R=SLICE_R*S,wy=wormY();
  fish=fish.filter(f=>{if(Math.hypot(f.x-hx,f.y+f.by-wy)<R+f.len*.3){cutFish(f,hx,wy);return false;}return true;});
  banner={text:'DRILL COMPLETE',sub:Math.floor(depth)+' m'+(drillCuts?' · '+drillCuts+' fish shredded':''),t:0,skill:true,col:'#ffc23a'};
}
function die(f){
  state='dead';deathT=0;killer=f;f.mouth=1;f.rot=0;shake=1;flash=1;sfx('chomp');buzz(120);
  boosting=false;ninjaT=0;slicing=false;dragTarget=null;touchBoost=false;
  if(depth>best){best=depth;newBest=true;localStorage.setItem('wormHookBest',String(Math.floor(best)));}
  for(let i=0;i<14;i++)bubbles.push({x:hx+rand(-15,15)*S,y:wormY()+rand(-15,15)*S,r:rand(2,6)*S,v:rand(60,160)*S});
}

/* ---------- fish spawning ---------- */
function pickType(){
  const el=TYPES.filter(t=>depth>=t.min&&depth<t.max);let tot=0;
  const ws=el.map(t=>{let w=t.w;if(depth-t.min<120)w*=1.8;if(t.max-depth<80)w*=.4;tot+=w;return w;});
  let r=Math.random()*tot;for(let i=0;i<el.length;i++){r-=ws[i];if(r<=0)return el[i];}
  return el[el.length-1];
}
function makeFish(t,x,y,dir,spd){
  return{t,x,y,dir,spd,len:t.len*S,ph:rand(0,6.28),bob:rand(0,6.28),by:0,mouth:0,rot:0,
    wr:rand(.6,1.4),open:false,pop:0,sm:1,chompIn:rand(.5,3),chompT:0};
}
function spawn(){
  const t=pickType(),L=t.len*S,hh=L*hitH(t);
  let x=rand(-L*.3,W+L*.3);let dir=Math.random()<.5?1:-1;
  if(x<0)dir=1;if(x>W)dir=-1;
  const spd=rand(t.spd[0],t.spd[1])*S*(1+Math.min(.5,depth/2000));
  const y=H+hh*.6+30*S;
  if(t.school){const n=randi(t.school[0],t.school[1]);
    for(let i=0;i<n;i++)fish.push(makeFish(t,x-dir*i*rand(18,32)*S,y+rand(-28,28)*S,dir,spd));}
  else fish.push(makeFish(t,x,y,dir,spd));
  if(t.id==='leviathan'&&!levWarned){levWarned=true;shake=.5;sfx('rumble');buzz(200);banner={text:'Something BIG is down here...',sub:'',t:0,warn:true};}
  return hh;
}

/* ---------- worm slice ---------- */
function trySlice(fromTap){
  if(state!=='play'||drilling)return;
  if(!sliceOn||depth<sliceReady){if(fromTap&&sliceOn){denyT=.4;sfx('deny');}return;}
  sliceReady=depth+SLICE_COOLDOWN;slicePinged=false;sliceFx=1;sfx('slice');buzz(30);shake=Math.max(shake,.35);
  const R=SLICE_R*S,wx=hx,wy=wormY();
  fish=fish.filter(f=>{if(Math.hypot(f.x-wx,f.y+f.by-wy)<R+f.len*.3){cutFish(f,wx,wy);return false;}return true;});
}
function cutFish(f,wx,wy){
  const a=Math.atan2(f.y-wy,f.x-wx),push=rand(160,260)*S;
  for(const half of[1,-1]){
    parts.push({f,half,x:f.x,y:f.y+f.by,vx:Math.cos(a)*push*.5+half*f.dir*rand(80,150)*S,
      vy:Math.sin(a)*push*.5+(half>0?-1:1)*rand(40,100)*S,rot:0,vr:half*f.dir*rand(2,5),life:1.2});
  }
  const n=Math.min(22,6+Math.round(f.len/(12*S)));
  for(let i=0;i<n;i++){const b=rand(0,6.28),sp=rand(80,280)*S;
    sparks.push({x:f.x+rand(-.2,.2)*f.len,y:f.y,vx:Math.cos(b)*sp,vy:Math.sin(b)*sp,life:rand(.4,.8),r:rand(2,4.5)*S,c:Math.random()<.5?'#ff5c7a':'#ffffff'});}
}

/* ---------- worm ninja ---------- */
function tryNinja(){
  if(state!=='play'||drilling)return;
  if(!ninjaOn||ninjaT>0||depth<ninjaReady){if(ninjaOn&&ninjaT<=0){denyT=.4;sfx('deny');}return;}
  ninjaT=NINJA_TIME;ninjaReady=Infinity;ninjaPinged=false;sfx('ninja');buzz([30,40,30]);
  dragTarget=null;touchBoost=false;primary=null;
  banner={text:'WORM NINJA!',sub:isTouch?'Swipe to slice fish':'Hold & drag to slice fish',t:0,skill:true,col:'#c9a2ff'};
}
function ninjaCut(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/(8*S)));
  fish=fish.filter(f=>{
    const a=f.len*.46,b=f.len*hitH(f.t)*.5+8*S;
    for(let i=0;i<=n;i++){const px=lerp(x0,x1,i/n)-f.x,py=lerp(y0,y1,i/n)-(f.y+f.by);
      if(px*px/(a*a)+py*py/(b*b)<1){cutFish(f,x0,y0);sfx('slice2');buzz(15);shake=Math.max(shake,.15);return false;}}
    return true;
  });
}

/* ---------- worm punch ---------- */
function punchFish(f){
  punchReady=depth+PUNCH_COOLDOWN;punchPinged=false;invuln=.8;shake=Math.max(shake,.6);sfx('punch');buzz(60);
  f.dead=true;
  const wy=wormY(),dir=Math.sign(f.x-hx)||-f.dir;
  flung.push({f,x:f.x,y:f.y+f.by,vx:dir*rand(550,850)*S,vy:rand(-320,-160)*S,rot:0,vr:dir*rand(6,10),life:1.3});
  pows.push({x:lerp(hx,f.x,.35),y:lerp(wy,f.y+f.by,.35),dir,t:0});
  for(let i=0;i<10;i++){const b=rand(0,6.28),sp=rand(120,300)*S;
    sparks.push({x:hx,y:wy,vx:Math.cos(b)*sp,vy:Math.sin(b)*sp,life:rand(.3,.6),r:rand(2,4)*S,c:Math.random()<.5?'#ffd84a':'#ffffff'});}
}
function drawPow(p){
  const s=(p.t<.08?p.t/.08:1)*(1+.08*Math.sin(p.t*40)),a=clamp((.65-p.t)/.25,0,1),R=48*S*s;
  ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(-.2);
  ctx.fillStyle='#ffd84a';ctx.strokeStyle='#e0302a';ctx.lineWidth=4*S;ctx.beginPath();
  for(let i=0;i<24;i++){const r=i%2?R*.55:R,an=i/24*Math.PI*2;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  if(p.t<.3){ // boxing glove
    const gx=p.x-p.dir*14*S,gy=p.y+4*S;
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.fillRect(gx-p.dir*16*S-5*S,gy-8*S,10*S,16*S);
    ctx.fillStyle='#e0302a';ctx.strokeStyle='#7a0f12';ctx.lineWidth=2*S;
    ctx.beginPath();ctx.arc(gx,gy,14*S,0,7);ctx.fill();ctx.stroke();ctx.restore();
  }
  ctx.globalAlpha=a;txt('POW!',p.x,p.y,22*S*s+6,'#e0302a');ctx.globalAlpha=1;
}

function mouthPt(f){const r=f.rot||0,m=f.dir*f.len*.5;return{x:f.x+Math.cos(r)*m,y:f.y+f.by+Math.sin(r)*m};}

/* ---------- update ---------- */
function update(dt){
  // Worm Ninja runs on real time; everything else slows down while it's active
  if(state==='play'&&ninjaT>0){
    ninjaT-=dt;
    if(ninjaT<=0){ninjaT=0;slicing=false;trail=[];ninjaReady=depth+NINJA_COOLDOWN;}
    else dt*=NINJA_SLOW;
  }
  T+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*2.2);
  if(flash>0)flash=Math.max(0,flash-dt*2.5);
  if(banner){banner.t+=dt;if(banner.t>3.4)banner=null;}
  if(!banner&&!drilling&&bannerQ.length)banner=bannerQ.shift();
  floaters.forEach(f=>f.t+=dt);floaters=floaters.filter(f=>f.t<1.4);
  if(sliceFx>0)sliceFx=Math.max(0,sliceFx-dt*2.6);
  if(denyT>0)denyT-=dt;
  if(moodPop>0)moodPop=Math.max(0,moodPop-dt*6);
  drops.forEach(d=>{d.vy+=700*S*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.life-=dt;});drops=drops.filter(d=>d.life>0);
  ripples.forEach(r=>{r.r+=70*S*dt;r.life-=dt*.8;});ripples=ripples.filter(r=>r.life>0);

  if(state==='intro'){
    introT+=dt;
    if(introT>.6&&!castSnd){castSnd=true;sfx('whoosh');}
    if(introT>=1.6&&!splashed){splashed=true;sfx('splash');
      const sx=W*.6,sy=H*.42;
      for(let i=0;i<26;i++)drops.push({x:sx,y:sy,vx:rand(-160,160)*S,vy:rand(-320,-120)*S,life:rand(.5,1),r:rand(2,4.5)*S});
      ripples.push({x:sx,y:sy,r:4*S,life:1},{x:sx,y:sy,r:1,life:1.25});}
    if(introT>=3.9)startPlay();
    return;
  }
  if(state!=='play'&&state!=='dead')return;

  const ppm=PPM*S,hy=HY();
  let scroll=0;
  if(state==='play'){
    if(!drilling)hintT+=dt;
    // burst stamina: drains while SPACE held (or finger dragged down), regenerates once released
    if(drilling){
      // Worm Drill: ramp up fast, cruise, then ease in to land exactly on the target depth
      boosting=false;stam=Math.min(1,stam+dt/BURST_REGEN);
      const rem=drillTarget-depth,gone=depth-drillStart;
      speedNow=clamp(Math.min(DRILL_VMAX,6+gone*6,3+rem*1.6),3,DRILL_VMAX);
      depth=Math.min(drillTarget,depth+speedNow*dt);
      drillHum-=dt;if(drillHum<=0){drillHum=.32;sfx('hum');}
      if(Math.random()<dt*40)sparks.push({x:hx+rand(-8,8)*S,y:wormY()+88*WK(),vx:rand(-160,160)*S,vy:rand(-40,120)*S,life:rand(.2,.45),r:rand(1.5,3)*S,c:Math.random()<.5?'#ffcf4a':'#ff8a2a'});
      if(depth>=drillTarget-.01)drillLand();
    }else{
      const want=!!keys[' ']||touchBoost;
      if(!want)stam=Math.min(1,stam+dt/BURST_REGEN);
      if(exhausted&&stam>=.25)exhausted=false;
      boosting=want&&!exhausted&&stam>0;
      if(boosting){stam-=dt/BURST_DRAIN;if(stam<=0){stam=0;exhausted=true;boosting=false;sfx('empty');}}
      const v=Math.min(17,3.7+depth*.0165);                 // base metres per second
      speedNow+=(v*(boosting?BOOST:1)-speedNow)*Math.min(1,dt*7);
      depth+=speedNow*dt;
    }
    viewDepth=depth;scroll=speedNow*ppm*dt;

    if(zoneIdx+1<ZONES.length&&depth>=ZONES[zoneIdx+1][0]){
      zoneIdx++;if(!drilling){sfx('zone');banner={text:ZONES[zoneIdx][1],sub:Math.floor(ZONES[zoneIdx][0])+' m',t:0};}}

    // Worm Drill pickups: place one just below the screen when its depth comes into view
    const ahead=(H-hy)/ppm+2;
    while(depth+ahead>=nextDrillAt){pickups.push({m:nextDrillAt,x:rand(Math.max(60*S,SAFE.l+40),Math.min(W-60*S,W-SAFE.r-40)),t:rand(0,6)});nextDrillAt+=DRILL_EVERY;}
    for(const p of pickups){
      p.t+=dt;const py=hy+(p.m-depth)*ppm;
      if(!p.got&&Math.hypot(p.x-hx,py-wormY())<(34*S+14*WK())){
        p.got=true;runDrills++;localStorage.setItem('wormHookDrills',String(runDrills));
        sfx('pickup');buzz([20,30,20]);
        floaters.push({x:p.x,y:py,t:0,text:'+'+DRILL_M+' m next run'});
        for(let i=0;i<16;i++){const b=rand(0,6.28),sp=rand(80,260)*S;sparks.push({x:p.x,y:py,vx:Math.cos(b)*sp,vy:Math.sin(b)*sp,life:rand(.4,.8),r:rand(2,4)*S,c:Math.random()<.5?'#ffd84a':'#ffffff'});}
      }
    }
    pickups=pickups.filter(p=>!p.got&&hy+(p.m-depth)*ppm>-80);

    // skill unlocks + cooldowns
    if(!sliceOn&&depth>=SLICE_UNLOCK){sliceOn=true;sliceReady=depth;slicePinged=true;sfx('unlock');buzz(40);
      showBanner({text:'SKILL UNLOCKED: WORM SLICE',sub:(isTouch?'Quick tap':'Press W / ↑')+' to slice fish around you · recharges every '+SLICE_COOLDOWN+' m',t:0,skill:true,col:'#ff9de0'});}
    if(sliceOn&&!slicePinged&&depth>=sliceReady){slicePinged=true;sfx('ready');}
    if(!ninjaOn&&depth>=NINJA_UNLOCK){ninjaOn=true;ninjaReady=depth;ninjaPinged=true;sfx('unlock');buzz(40);
      showBanner({text:'SKILL UNLOCKED: WORM NINJA',sub:(isTouch?'Two-finger tap, then swipe':'Press E, then hold & drag')+' to slice in slow motion for '+NINJA_TIME+'s',t:0,skill:true,col:'#c9a2ff'});}
    if(ninjaOn&&!ninjaPinged&&ninjaT<=0&&depth>=ninjaReady){ninjaPinged=true;sfx('ready');}
    if(!punchOn&&depth>=PUNCH_UNLOCK){punchOn=true;punchReady=depth;punchPinged=true;sfx('unlock');buzz(40);
      showBanner({text:'SKILL UNLOCKED: WORM PUNCH',sub:'Auto-punches the next fish that hits you · recharges every '+PUNCH_COOLDOWN+' m',t:0,skill:true,col:'#ffb347'});}
    if(punchOn&&!punchPinged&&depth>=punchReady){punchPinged=true;sfx('ready');}
    if(invuln>0)invuln-=dt;

    // steering: keyboard pushes with momentum, a dragged finger/mouse sets a target position
    curMaxV=(480+Math.min(160,depth*.12))*S;
    const m=24*S,old=hx;
    const kdir=clamp(((keys['a']||keys['arrowleft'])?-1:0)+((keys['d']||keys['arrowright'])?1:0),-1,1);
    let homeX=null;
    if(drilling&&dragTarget===null&&!kdir){
      let bestD=1e9;const wy0=wormY();
      for(const f of fish){if(f.dead)continue;const dy=f.y-wy0;if(dy<-20*S||dy>H*.55)continue;
        const d=Math.abs(f.x-hx)+dy*.6;if(d<bestD){bestD=d;homeX=f.x+f.dir*f.spd*(dy/Math.max(1,speedNow*ppm));}}
    }
    if(homeX!==null){
      const lim=curMaxV*1.4*dt;hx+=clamp((clamp(homeX,m,W-m)-hx)*Math.min(1,dt*6),-lim,lim);
      hvx+=((hx-old)/Math.max(dt,1e-4)-hvx)*Math.min(1,dt*12);
    }else if(dragTarget!==null){
      const lim=curMaxV*1.8*dt;                                // capped so dragging can't teleport the worm
      hx+=clamp((dragTarget-hx)*Math.min(1,dt*18),-lim,lim);
      hvx+=((hx-old)/Math.max(dt,1e-4)-hvx)*Math.min(1,dt*12);
    }else{
      const dir=clamp(((keys['a']||keys['arrowleft'])?-1:0)+((keys['d']||keys['arrowright'])?1:0),-1,1);
      if(dir){hvx+=dir*3200*S*dt;if(Math.sign(hvx)!==dir)hvx+=dir*3000*S*dt;}
      else hvx*=Math.pow(.0008,dt);
      hvx=clamp(hvx,-curMaxV,curMaxV);hx+=hvx*dt;
    }
    if(hx<m){hx=m;hvx=0;}if(hx>W-m){hx=W-m;hvx=0;}
    if(window.__frozen){scroll=0;depth-=speedNow*dt;spawnAcc=0;}   // test hook only
    spawnAcc+=scroll;
    while(spawnAcc>=nextGap){spawnAcc-=nextGap;const hh=spawn();
      nextGap=(Math.max(95,220-depth*.1)*S+hh*.7)*rand(.75,1.25);}
    bubbleT-=dt*(boosting?3:1);if(bubbleT<=0){bubbleT=rand(.25,.6);bubbles.push({x:hx+rand(-6,6)*S,y:wormY()-14*S,r:rand(1.5,3.5)*S,v:rand(30,70)*S});}
  } else {
    // eaten: fisherman yoinks the fish all the way up
    deathT+=dt;
    const prev=viewDepth;
    if(deathT>=REEL_START)reelStarted=true;
    if(reelStarted&&reelFrom===null){reelFrom=viewDepth;sfx('yoink');}
    if(reelStarted&&!reelDone){const u=clamp((deathT-REEL_START)/(REEL_END-REEL_START),0,1);viewDepth=lerp(reelFrom,-3,ease(u));}
    if(deathT>=REEL_END&&!reelDone){reelDone=true;flash=.8;sfx('splash');
      const sx=boatX()+150*S,sy=H*.42;
      for(let i=0;i<24;i++)drops.push({x:sx+rand(-20,20)*S,y:sy,vx:rand(-140,140)*S,vy:rand(-380,-140)*S,life:rand(.5,1.1),r:rand(2,4.5)*S});
      ripples.push({x:sx,y:sy,r:4*S,life:1},{x:sx,y:sy,r:1,life:1.25});}
    scroll=(viewDepth-prev)*ppm;
  }
  ax+=(hx-ax)*Math.min(1,dt*1.6);

  // fish
  const wx=hx,wy=wormY(),wr=WORM_R*S;let thr=0,thrDir=0;
  for(const f of fish){
    const op=f.mouth>.5;if(op!==f.open){f.open=op;f.pop=1;}f.pop=Math.max(0,f.pop-dt*5);
    if(state==='dead'&&f===killer){
      f.by=0;
      if(deathT<.25){const k=Math.min(1,dt*18);f.x+=(wx-f.dir*f.len*.46-f.x)*k;f.y+=(wy-f.y)*k;f.mouth=1;}
      else{
        f.mouth+=(.3-f.mouth)*Math.min(1,dt*8);f.ph+=dt*16;
        const tr=-f.dir*Math.PI/2+Math.sin(T*13)*.22;          // hang mouth-up, flailing
        f.rot+=(tr-f.rot)*Math.min(1,dt*7);
        const mx2=hx+Math.sin(T*3)*8*S,my2=hy-12*S;
        const cx=mx2-Math.cos(f.rot)*f.dir*f.len*.5,cy=my2-Math.sin(f.rot)*f.dir*f.len*.5,k=Math.min(1,dt*6);
        f.x+=(cx-f.x)*k;f.y+=(cy-f.y)*k;
      }
      continue;
    }
    // speed surges and lulls so fish don't glide like a conveyor belt
    f.sm=.72+.4*Math.max(0,Math.sin(T*f.wr*1.3+f.bob))+.12*Math.sin(T*f.wr*3.1+f.bob*2);
    f.ph+=dt*(4+f.spd*f.sm/(40*S));f.by=Math.sin(f.bob+T*2)*3*S+Math.sin(T*f.wr*.8+f.bob)*6*S;
    f.x+=f.dir*f.spd*f.sm*dt;f.y-=scroll;
    const dx=wx-f.x,dy=wy-(f.y+f.by);
    const near=state==='play'&&Math.hypot(dx,dy)<f.len*1.6&&dx*f.dir>0;
    // jaws: open when hunting the worm, plus an idle snap every few seconds
    f.chompIn-=dt;if(f.chompIn<=0){f.chompIn=rand(1.6,4);f.chompT=.35;}
    if(f.chompT>0)f.chompT-=dt;
    const want=(near||f.chompT>0)?1:0;
    f.mouth+=(want-f.mouth)*Math.min(1,dt*(want?14:6));
    if(state==='play'&&dx*f.dir>0){const d=Math.hypot(dx,dy)-f.len*.45,th=clamp(1-d/(140*S),0,1);
      if(th>thr){thr=th;thrDir=Math.sign(dx)||1;}}
    if(state==='play'&&drilling&&!f.dead){
      const a=f.len*.42+DRILL_R*S,b=f.len*hitH(f.t)*.5+DRILL_R*S,ex=wx-f.x,ey=wy+40*WK()-(f.y+f.by);
      if((ex*ex)/(a*a)+(ey*ey)/(b*b)<1){f.dead=true;drillCuts++;cutFish(f,wx,wy);sfx('slice2');buzz(12);shake=Math.max(shake,.22);}
      continue;
    }
    if(state==='play'&&!f.dead&&invuln<=0){
      const a=f.len*.42+wr,b=f.len*hitH(f.t)*.5+wr;
      if((dx*dx)/(a*a)+(dy*dy)/(b*b)<1){
        if(punchOn&&depth>=punchReady)punchFish(f);else die(f);
      }
    }
  }
  threat+=(thr-threat)*Math.min(1,dt*(thr>threat?10:3));
  flinch+=((thr>.15?thrDir:0)*threat-flinch)*Math.min(1,dt*8);
  // worm mood: scared when a fish is closing in, screaming when caught
  const nm=state==='dead'?'worm_scream':(threat>.45&&!drilling)?'worm_scared':'worm';
  if(nm!==mood){mood=nm;moodPop=1;}
  fish=fish.filter(f=>f===killer||!(f.dead||f.y<-f.len-80||(state==='dead'&&f.y>H+f.len+60*S)||(f.dir>0&&f.x>W+f.len)||(f.dir<0&&f.x<-f.len)));

  // sliced halves, punched fish, effects
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt-scroll;p.vx*=Math.pow(.25,dt);p.vy=p.vy*Math.pow(.25,dt)+40*S*dt;p.rot+=p.vr*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt-scroll;p.vx*=Math.pow(.1,dt);p.vy*=Math.pow(.1,dt);p.life-=dt;}
  sparks=sparks.filter(p=>p.life>0);
  for(const p of flung){p.x+=p.vx*dt;p.y+=p.vy*dt-scroll;p.vy+=500*S*dt;p.rot+=p.vr*dt;p.life-=dt;}
  flung=flung.filter(p=>p.life>0);
  pows.forEach(p=>p.t+=dt);pows=pows.filter(p=>p.t<.65);
  trail=trail.filter(p=>T-p.t<.22);

  // particles
  for(const s of snow){s.y-=scroll*s.p+6*S*dt*s.p;
    if(s.y<-5){s.y=H+5;s.x=rand(0,W);}else if(s.y>H+5){s.y=-5;s.x=rand(0,W);}}
  bubbles.forEach(b=>{b.y-=b.v*dt+scroll*.5;b.x+=Math.sin(T*4+b.y*.05)*12*S*dt;});
  bubbles=bubbles.filter(b=>b.y>-10&&b.y<H+20);
}

/* ---------- drawing: hook & worm (sprites) ---------- */
// x,y = worm position; the hook eye sits 36 units above it. ang = tilt, wig = wriggle speed,
// band = ninja headband, md = which worm face to show
function drawHookWorm(x,y,ang,k,wig,band,md){
  const hk=SPR.hook,wm=(SPR[md]&&SPR[md].ready)?SPR[md]:SPR.worm;
  if(!hk.ready||!wm.ready)return;
  ctx.save();ctx.translate(x,y-36*k);ctx.rotate(ang+Math.sin(T*2.3)*.11+Math.sin(T*3.7)*.04);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  // hook: rigid, hangs from its eye
  const Hh=HOOK.h*k,Wh=Hh/hk.ar;
  ctx.drawImage(hk,-HOOK.eye[0]*Wh,-HOOK.eye[1]*Hh,Wh,Hh);
  // worm: sliced into strips that sway in a travelling wave. The head stays rigid so the face reads clearly
  const pop=md===mood?moodPop:0;
  const breathe=1+.02*Math.sin(T*3.2)+.08*pop;
  const Hs=WORM.h*k*breathe,Ws=WORM.h*k/wm.ar/Math.sqrt(breathe);
  const ox=-WORM.u*Ws,oy=(36+WORM.top)*k;
  const amp=7*k,iw=wm.naturalWidth,ih=wm.naturalHeight;
  const off=v=>Math.sin(T*wig*.55-v*7)*amp*Math.pow(clamp((v-.32)/.68,0,1),1.1)+Math.sin(T*wig*.3)*1.5*k;
  const N=32;
  for(let i=0;i<N;i++){
    const v0=i/N,v1=(i+1)/N,sy=v0*ih,sh=Math.min(ih-sy,(v1-v0)*ih+1);
    ctx.drawImage(wm,0,sy,iw,sh,ox+off((v0+v1)/2),oy+v0*Hs,Ws,sh/ih*Hs);
  }
  const P=(u,v)=>[ox+u*Ws+off(v),oy+v*Hs];
  // blink every few seconds (angry face only)
  const bt=T%3.4;
  if(wm===SPR.worm&&bt<.13){const c=1-Math.abs(bt-.065)/.065;
    for(const e of WORM.eyes){const [ex,ey]=P(e[0],e[1]),rx=e[2]*Ws*1.12,ry=e[3]*Hs*1.12;
      ctx.save();ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,7);ctx.clip();
      ctx.fillStyle=WORM.lid;ctx.fillRect(ex-rx,ey-ry,rx*2,ry*2*c);
      ctx.strokeStyle='#3a1a22';ctx.lineWidth=1.4*k;ctx.beginPath();ctx.moveTo(ex-rx,ey-ry+ry*2*c);ctx.lineTo(ex+rx,ey-ry+ry*2*c);ctx.stroke();
      ctx.restore();}}
  // ninja headband: tied at the back of the head, tails streaming behind
  if(band){
    const [l,r]=WORM.band.map(b=>P(b[0],b[1])),fl=Math.sin(T*18)*2.5*k;
    ctx.lineCap='round';ctx.strokeStyle='#7a0f12';ctx.lineWidth=5*k;
    ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(r[0],r[1]);ctx.stroke();
    ctx.strokeStyle='#e0302a';ctx.lineWidth=3.4*k;
    ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(r[0],r[1]);
    ctx.moveTo(l[0],l[1]);ctx.quadraticCurveTo(l[0]-7*k,l[1]-3*k+fl,l[0]-14*k,l[1]-1*k-fl);
    ctx.moveTo(l[0],l[1]);ctx.quadraticCurveTo(l[0]-6*k,l[1]+2*k-fl,l[0]-12*k,l[1]+6*k+fl);ctx.stroke();
  }
  ctx.restore();
}
function drawFear(x,y){
  if(threat>.7){ // alarm mark (the scared face already has its own sweat drop)
    const a=clamp((threat-.7)/.15,0,1),b=1+.15*Math.sin(T*20);
    ctx.save();ctx.globalAlpha=a;ctx.translate(x+(flinch>0?-24:24)*WK(),y-60*WK());ctx.scale(b,b);
    txt('!',0,0,22*S+4,'#ffde3a');ctx.restore();}
}

/* ---------- drawing: fish (sprites) ---------- */
// Each fish swaps closed -> open mouth art as it closes in, and snaps shut on the bite.
// The image is sliced into vertical strips that ripple in a swim wave: head steady, tail swings most.
function drawFish(f){
  const t=f.t,open=f.mouth>.5,key=open?t.id+'_open':t.id,img=(SPR[key]&&SPR[key].ready)?SPR[key]:SPR[t.id];
  if(!img||!img.ready)return;
  const L=f.len,Hs=L*img.ar,iw=img.naturalWidth,ih=img.naturalHeight;
  const lunge=clamp(f.mouth,0,1),pop=f.pop||0;
  ctx.save();ctx.translate(f.x,f.y+f.by);if(f.rot)ctx.rotate(f.rot);ctx.scale(f.dir,1);
  // squash & stretch: swell when lunging, elastic pop when the mouth changes state
  ctx.scale(1+.07*lunge+.14*pop*Math.cos(pop*9),1+.05*lunge-.1*pop*Math.cos(pop*9));
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  const lev=t.id==='leviathan',amp=Hs*(lev?.13:.12),spd=lev?.7:1;
  ctx.rotate(Math.sin(f.ph*spd*.5+1)*(lev?.03:.07));
  const N=lev?40:22;
  const strips=()=>{for(let i=0;i<N;i++){
    const u0=i/N,u1=(i+1)/N,um=(u0+u1)/2;
    const w=Math.pow(1-um,lev?1:2.2);                       // 1 at tail, 0 at head
    const dy=Math.sin(f.ph*spd-um*(lev?9:4))*amp*w;
    const sx=u0*iw,sw=Math.min(iw-sx,(u1-u0)*iw+1);
    ctx.drawImage(img,sx,0,sw,ih,-L/2+u0*L,-Hs/2+dy,sw/iw*L+.5,Hs);}};
  strips();
  if(f.flash>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha*=f.flash;strips();strips();ctx.restore();}
  if(t.lure){
    const lp=ANGLER_LURE[key]||ANGLER_LURE.angler,gx=-L/2+lp[0]*L,gy=-Hs/2+lp[1]*Hs,r=L*.05*(1+.2*Math.sin(T*6));
    ctx.save();ctx.globalCompositeOperation='lighter';
    const lg=ctx.createRadialGradient(gx,gy,0,gx,gy,r*4);
    lg.addColorStop(0,'rgba(170,255,250,.6)');lg.addColorStop(1,'rgba(80,255,230,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(gx,gy,r*4,0,7);ctx.fill();ctx.restore();
  }
  if(t.glow){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha*=.12+.1*Math.sin(T*3);
    ctx.drawImage(img,-L/2,-Hs/2,L,Hs);ctx.restore();}
  if(f.stars){ // dizzy stars circling the head
    for(let i=0;i<3;i++){const a=T*6+i*2.09,r=L*.16+6*S;
      drawStar(L*.3+Math.cos(a)*r,-Hs*.45+Math.sin(a)*r*.35,(5+2*Math.sin(T*9+i))*S);}
  }
  ctx.restore();
}
function drawDrillBit(x,y,h,spin,alpha){
  const im=SPR.drill;if(!im||!im.ready)return;
  const w=h/im.ar,sx=.72+.28*Math.abs(Math.cos(spin));
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(x,y);ctx.scale(Math.cos(spin)<0?-sx:sx,1);
  ctx.drawImage(im,-w/2,0,w,h);
  // spiral glint sliding down the bit sells the spin
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha*=.35;ctx.fillStyle='#fff6c8';
  const gy=h*(.35+((spin*.25)%1+1)%1*.5);ctx.beginPath();ctx.ellipse(0,gy,w*.28,h*.035,-.35,0,7);ctx.fill();
  ctx.restore();
}
function drawPickup(p,y){
  const k=WK(),bob=Math.sin(p.t*3)*5*S,r=(26+3*Math.sin(p.t*5))*k;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(p.x,y+bob,0,p.x,y+bob,r*2);g.addColorStop(0,'rgba(255,214,90,.65)');g.addColorStop(1,'rgba(255,170,40,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,y+bob,r*2,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(255,230,140,.9)';ctx.lineWidth=2.5*k;ctx.beginPath();ctx.arc(p.x,y+bob,r,0,7);ctx.stroke();ctx.restore();
  drawDrillBit(p.x,y+bob-r*.8,r*1.6,p.t*2.2);
  txt('WORM DRILL',p.x,y+bob+r+11*k,9*S+4,'#ffd84a','center',800);
}
function drawStar(x,y,r){
  ctx.save();ctx.translate(x,y);ctx.rotate(T*4);ctx.fillStyle='#ffe14a';ctx.strokeStyle='#8a5a00';ctx.lineWidth=1.2*S;ctx.beginPath();
  for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i/10*Math.PI*2-Math.PI/2;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}

/* ---------- drawing: surface / intro / caught scene ---------- */
const boatX=()=>Math.max(W*.2,SAFE.l+130*S);
function fisherPose(t,isTitle){
  let rod,lean;
  if(isTitle){rod=Math.sin(T*1.1)*.12+Math.sin(T*2.9)*.04;lean=0;}
  else if(t<.55){const e=ease(t/.55);rod=-1.05*e;lean=-.09*e;}                       // wind up
  else if(t<.8){const e=ease((t-.55)/.25);rod=lerp(-1.05,.32,e);lean=lerp(-.09,.07,e);} // flick
  else{const e=clamp((t-.8)/.7,0,1);rod=lerp(.32,.04,e)+Math.sin(t*16)*.07*(1-e);lean=lerp(.07,0,e);} // settle
  const roll=Math.sin(T*1.3)*.085+Math.sin(T*2.1+1)*.035+lean;
  return{rod,roll,heave:(Math.sin(T*1.6)*3+Math.sin(T*2.7)*1.2)*S};
}
function fisherTip(bx,by,P){
  const Wf=FISHER.w*S,Hf=Wf*FISHER.ar;
  const px=(FISHER.piv[0]-FISHER.mid)*Wf,py=(FISHER.piv[1]-FISHER.water)*Hf;
  const tx=(FISHER.tip[0]-FISHER.piv[0])*Wf,ty=(FISHER.tip[1]-FISHER.piv[1])*Hf;
  const c=Math.cos(P.rod),s=Math.sin(P.rod),lx=px+tx*c-ty*s,ly=py+tx*s+ty*c;
  const C=Math.cos(P.roll),Sn=Math.sin(P.roll);
  return{x:bx+lx*C-ly*Sn,y:by+P.heave+lx*Sn+ly*C};
}
// cheering pose: one rigid sprite, so the rod tip just follows the boat's rocking (plus a victory bounce)
function cheerPose(){
  const bounce=Math.abs(Math.sin(T*5))*4*S*Math.max(0,1-(deathT-REEL_END)*.6);
  return{roll:Math.sin(T*1.3)*.07+Math.sin(T*2.1+1)*.03,heave:(Math.sin(T*1.6)*3)*S-bounce};
}
function cheerTip(bx,by,P){
  const im=SPR.fisher_cheer,Wf=CHEER.w*S,Hf=Wf*(im.ar||.757);
  const lx=(CHEER.tip[0]-CHEER.mid)*Wf,ly=(CHEER.tip[1]-CHEER.water)*Hf,C=Math.cos(P.roll),Sn=Math.sin(P.roll);
  return{x:bx+lx*C-ly*Sn,y:by+P.heave+lx*Sn+ly*C};
}
function drawRays(top,alpha){
  if(alpha<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){const x=W*(i/5)+Math.sin(T*.3+i*1.7)*60*S,w=(50+i%3*30)*S;
    const g=ctx.createLinearGradient(0,top,0,top+H*1.1);g.addColorStop(0,`rgba(200,240,255,${alpha})`);g.addColorStop(1,'rgba(200,240,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w*.5,top);ctx.lineTo(x+w*.5,top);ctx.lineTo(x+w*1.6-140*S,top+H*1.1);ctx.lineTo(x-w*.3-140*S,top+H*1.1);ctx.fill();}
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawSurfaceScene(t,isTitle,caught){
  const surf=H*.42,hy=HY(),ppm=PPM*S,sink=hy+30*S;
  const bx=boatX(),by=surf;
  const FP=caught?cheerPose():fisherPose(t,isTitle),tip=caught?cheerTip(bx,by,FP):fisherTip(bx,by,FP);introTipX=tip.x;
  const P1={x:W*.6,y:surf+6*S};let wx,wy,camY=0,flying=false;
  if(isTitle||t<.75){wx=tip.x+Math.sin(T*2)*4*S;wy=tip.y+36*WK();}
  else if(t<1.6){const u=(t-.75)/.85;wx=lerp(tip.x,P1.x,u);wy=lerp(tip.y+36*WK(),P1.y,u)-Math.sin(u*Math.PI)*H*.22;flying=true;}
  else if(t<1.9){wx=P1.x;wy=P1.y+Math.sin((t-1.6)*12)*2*S;}
  else{const e=ease((t-1.9)/2);wx=lerp(P1.x,W/2,e);wy=lerp(P1.y,surf+sink,e);camY=e*(surf+sink-hy);}

  ctx.save();ctx.translate(0,-camY);
  const sg=ctx.createLinearGradient(0,0,0,surf);sg.addColorStop(0,'#6ec3f0');sg.addColorStop(1,'#dff4ff');ctx.fillStyle=sg;ctx.fillRect(0,-10,W,surf+10);
  ctx.fillStyle='#fff3b0';ctx.shadowColor='#fff3b0';ctx.shadowBlur=40*S;ctx.beginPath();ctx.arc(W*.82,SAFE.t+H*.12,38*S,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<4;i++){const cx=((i*W*.33+T*12*(1+i*.3))%(W+300))-150,cy=SAFE.t+H*(.08+i*.06);
    ctx.beginPath();ctx.ellipse(cx,cy,60*S,18*S,0,0,7);ctx.ellipse(cx+35*S,cy-10*S,38*S,18*S,0,0,7);ctx.ellipse(cx-30*S,cy-4*S,30*S,14*S,0,0,7);ctx.fill();}
  const deepH=H*2;const wg=ctx.createLinearGradient(0,surf,0,surf+deepH);
  wg.addColorStop(0,colAt(0));wg.addColorStop(1,colAt(deepH/ppm));ctx.fillStyle=wg;ctx.fillRect(0,surf,W,deepH);
  ctx.save();ctx.beginPath();ctx.rect(0,surf,W,deepH);ctx.clip();drawRays(surf,.12);ctx.restore();
  // fisherman + boat. Casting: body and rod are separate pieces. Score screen: cheering pose
  ctx.save();ctx.beginPath();ctx.rect(0,-1e4,W,surf+1e4+7*S);ctx.clip();
  if(caught&&SPR.fisher_cheer.ready){
    const im=SPR.fisher_cheer,Wf=CHEER.w*S,Hf=Wf*im.ar;
    ctx.translate(bx,by+FP.heave);ctx.rotate(FP.roll);
    ctx.drawImage(im,-CHEER.mid*Wf,-CHEER.water*Hf,Wf,Hf);
  }else{
    const body=SPR.fisher_body,rod=SPR.fisher_rod,Wf=FISHER.w*S,Hf=Wf*FISHER.ar;
    if(body.ready&&rod.ready){
      ctx.translate(bx,by+FP.heave);ctx.rotate(FP.roll);
      const px=(FISHER.piv[0]-FISHER.mid)*Wf,py=(FISHER.piv[1]-FISHER.water)*Hf;
      ctx.save();ctx.translate(px,py);ctx.rotate(FP.rod);
      const R=FISHER.rod;ctx.drawImage(rod,(R[0]-FISHER.piv[0])*Wf,(R[1]-FISHER.piv[1])*Hf,(R[2]-R[0])*Wf,(R[3]-R[1])*Hf);ctx.restore();
      ctx.drawImage(body,-FISHER.mid*Wf,-FISHER.water*Hf,Wf,Hf);
    }
  }
  ctx.restore();
  // foam where the hull meets the water
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineCap='round';
  for(let i=0;i<5;i++){const ph=(T*.6+i/5)%1,x=bx+(-115+ph*230)*S,a=Math.sin(ph*Math.PI);
    ctx.globalAlpha=a*.8;ctx.lineWidth=(2+2*a)*S;ctx.beginPath();ctx.ellipse(x,surf+4*S+FP.roll*(x-bx)*.6,(10+8*a)*S,2.5*S,0,0,7);ctx.stroke();}
  ctx.restore();
  // waves
  ctx.fillStyle='rgba(120,210,245,.55)';ctx.beginPath();ctx.moveTo(0,surf+20*S);
  for(let x=0;x<=W+10;x+=10)ctx.lineTo(x,surf+Math.sin(x*.025+T*2)*4*S);ctx.lineTo(W,surf+20*S);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2*S;ctx.beginPath();
  for(let x=0;x<=W+10;x+=10){const y=surf+Math.sin(x*.025+T*2)*4*S;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  ripples.forEach(r=>{ctx.strokeStyle=`rgba(255,255,255,${r.life*.7})`;ctx.lineWidth=2*S;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.25,0,0,7);ctx.stroke();});
  drops.forEach(d=>{ctx.fillStyle=`rgba(230,248,255,${Math.min(1,d.life*1.5)})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();});
  if(caught){
    // the fish that ate you, dangling dazed from the rod
    const k=Math.min(1,H*.3/caught.len),L=caught.len*k,sw=Math.sin(T*2.2)*.18;
    const mx2=tip.x+Math.sin(sw)*18*S,my2=tip.y+Math.cos(sw)*18*S,r=-caught.dir*Math.PI/2-sw;
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(tip.x,tip.y);ctx.lineTo(mx2,my2);ctx.stroke();
    drawFish({...caught,len:L,rot:r,by:0,x:mx2-Math.cos(r)*caught.dir*L*.5,y:my2-Math.sin(r)*caught.dir*L*.5,mouth:.3,pop:0,ph:T*12,stars:true});
    ctx.restore();return;
  }
  const ey=wy-36*WK();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(tip.x,tip.y);
  ctx.quadraticCurveTo((tip.x+wx)/2,Math.max(tip.y,ey)+(flying?-10:25)*S,wx,ey);ctx.stroke();
  // the worm screams while it's flung through the air
  drawHookWorm(wx,wy,flying?Math.sin(t*14)*.6:Math.sin(T*2)*.08,WK(),isTitle?6:10,false,flying?'worm_scream':'worm');
  ctx.restore();
}

/* ---------- drawing: play ---------- */
function drawPart(p){
  const f=p.f,L=f.len,side=p.half*f.dir;
  ctx.save();ctx.globalAlpha=clamp(p.life,0,1);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  ctx.beginPath();if(side>0)ctx.rect(0,-L,L,2*L);else ctx.rect(-L,-L,L,2*L);ctx.clip();
  drawFish({...f,x:0,y:0,by:0,rot:0,pop:0,flash:clamp((p.life-.95)/.25,0,1)});
  ctx.fillStyle='#c8324d';ctx.beginPath();ctx.ellipse(0,0,3*S,L*hitH(f.t)*.55,0,0,7);ctx.fill();
  ctx.restore();
}
function drawPlay(){
  const ppm=PPM*S,hy=HY(),wy=wormY(),vd=viewDepth,dTop=vd-hy/ppm,dBot=dTop+H/ppm;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,colAt(dTop));g.addColorStop(1,colAt(dBot));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawRays(0,.12*clamp(1-dTop/220,0,1));
  const bio=clamp((vd-350)/400,0,1);
  for(const s of snow){const a=.25+.35*s.p;
    if(bio>0&&s.p>.75){ctx.fillStyle=`rgba(120,255,235,${a*bio*(.5+.5*Math.sin(T*3+s.tw))})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r*1.4,0,7);ctx.fill();}
    else{ctx.fillStyle=`rgba(255,255,255,${a*(1-bio*.5)})`;ctx.fillRect(s.x,s.y,s.r,s.r);}}
  // speed lines (burst / yoink)
  const reeling=state==='dead'&&reelStarted&&!reelDone,sl=reeling?1:(state==='play'&&drilling)?1.6:(state==='play'&&boosting?.85:0);
  if(sl>0){ctx.strokeStyle=drilling&&state==='play'?`rgba(255,215,140,${.16*sl})`:`rgba(255,255,255,${.16*sl})`;ctx.lineWidth=2*S;const sp=(reeling?-1:1)*2600*S,M=H+200;
    for(let i=0;i<22;i++){const x=((i*.618034)%1)*W,len=(90+(i%4)*35)*S,y=((((i*211*S-T*sp)%M)+M)%M)-100;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+len);ctx.stroke();}}
  // depth ruler
  ctx.textAlign='right';ctx.textBaseline='middle';ctx.font=`600 ${Math.round(11+4*S)}px system-ui,sans-serif`;
  const start=Math.floor(dTop/5)*5,rx=W-SAFE.r;
  for(let m=start;m<dBot+5;m+=5){if(m<0)continue;const y=hy+(m-vd)*ppm,big=m%25===0;
    ctx.strokeStyle=`rgba(255,255,255,${big?.45:.2})`;ctx.lineWidth=big?2:1;ctx.beginPath();ctx.moveTo(rx-(big?22:10)*S,y);ctx.lineTo(rx,y);ctx.stroke();
    if(big){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText(m+' m',rx-28*S,y);}}
  // line + hook
  const showWorm=!(state==='dead'&&deathT>.2);
  let lx=hx,ly=hy-36*WK();
  if(!showWorm&&killer){const mp=mouthPt(killer);lx=mp.x;ly=mp.y;}
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(ax,-10);ctx.quadraticCurveTo(lerp(ax,lx,.5),ly*.55,lx,ly);ctx.stroke();
  if(state==='play'&&sliceOn&&depth>=sliceReady){
    ctx.save();ctx.setLineDash([8*S,10*S]);ctx.lineDashOffset=-T*30;ctx.strokeStyle=`rgba(255,157,224,${.18+.1*Math.sin(T*4)})`;ctx.lineWidth=2*S;
    ctx.beginPath();ctx.arc(hx,wy,SLICE_R*S,0,7);ctx.stroke();ctx.restore();}
  if(state==='play'&&punchOn&&depth>=punchReady){ // punch-ready aura
    ctx.save();ctx.strokeStyle=`rgba(255,179,71,${.4+.2*Math.sin(T*5)})`;ctx.lineWidth=2.5*S;
    ctx.beginPath();ctx.ellipse(hx,wy,28*WK(),48*WK(),0,0,7);ctx.stroke();ctx.restore();}
  if(state==='play'&&drilling){
    const k=WK();ctx.save();ctx.globalCompositeOperation='lighter';
    const g2=ctx.createRadialGradient(hx,wy+70*k,0,hx,wy+70*k,70*k);g2.addColorStop(0,'rgba(255,190,60,.45)');g2.addColorStop(1,'rgba(255,120,20,0)');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(hx,wy+70*k,70*k,0,7);ctx.fill();ctx.restore();
    drawDrillBit(hx,wy+6*k,84*k,T*30);
  }
  if(showWorm&&!(invuln>0&&!drilling&&Math.floor(T*20)%2)){
    const tr=drilling?Math.sin(T*70)*1.4*S:threat>.35?Math.sin(T*55)*1.6*S*threat:0;
    drawHookWorm(hx+tr,hy,clamp(-hvx/curMaxV*.35,-.45,.45)-flinch*.32+(sliceFx>0?(1-sliceFx)*Math.PI*2:0),WK(),10+Math.abs(hvx)/(40*S)+(boosting?10:0)+threat*14,ninjaT>0,mood);
    if(state==='play'&&!drilling)drawFear(hx+tr,hy);
  }
  for(const p of pickups)drawPickup(p,hy+(p.m-vd)*ppm);
  for(const f of fish)drawFish(f);
  for(const p of parts)drawPart(p);
  for(const p of flung){ctx.save();ctx.globalAlpha=clamp(p.life,0,1);drawFish({...p.f,x:p.x,y:p.y,by:0,rot:p.rot,mouth:0,pop:0,flash:clamp((p.life-1.05)/.25,0,1),stars:true});ctx.restore();}
  for(const p of sparks){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  // slice effect
  if(sliceFx>0){const R=SLICE_R*S*(.45+.55*(1-sliceFx)),cx=hx,cy=wy;
    ctx.save();ctx.fillStyle=`rgba(255,157,224,${.18*sliceFx})`;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    ctx.shadowColor='#ff9de0';ctx.shadowBlur=18*S;ctx.lineCap='round';
    for(let i=0;i<3;i++){const a0=(1-sliceFx)*Math.PI*5+i*Math.PI*2/3;
      ctx.strokeStyle=`rgba(255,255,255,${sliceFx})`;ctx.lineWidth=7*S*sliceFx+1;ctx.beginPath();ctx.arc(cx,cy,R,a0,a0+1.7);ctx.stroke();}
    ctx.restore();}
  ctx.strokeStyle='rgba(220,245,255,.7)';ctx.lineWidth=1;bubbles.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke();});
  const vg=clamp((vd-250)/900,0,.65);
  if(vg>0){const r=ctx.createRadialGradient(W/2,hy+H*.15,Math.min(W,H)*.25,W/2,hy+H*.15,Math.max(W,H)*.8);
    r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,`rgba(0,0,0,${vg})`);ctx.fillStyle=r;ctx.fillRect(0,0,W,H);}
  for(const p of pows)drawPow(p);
  for(const f of floaters){const a=clamp(1.4-f.t,0,1);ctx.globalAlpha=a;txt(f.text,f.x,f.y-f.t*60*S,13*S+6,'#ffd84a');ctx.globalAlpha=1;}
  if(state==='play'&&drilling){ // warm vignette while drilling
    const og=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
    og.addColorStop(0,'rgba(255,140,30,0)');og.addColorStop(1,'rgba(255,140,30,.28)');ctx.fillStyle=og;ctx.fillRect(0,0,W,H);}
  // worm ninja overlay, blade trail and cursor
  if(state==='play'&&ninjaT>0){
    const a=Math.min(1,ninjaT*2,(NINJA_TIME-ninjaT)*4);
    const ng=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
    ng.addColorStop(0,'rgba(140,60,200,0)');ng.addColorStop(1,`rgba(140,60,200,${.4*a})`);ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#d9a8ff';ctx.shadowBlur=18*S;
    for(let i=1;i<trail.length;i++){const p0=trail[i-1],p1=trail[i],age=clamp((T-p1.t)/.22,0,1);
      ctx.strokeStyle=`rgba(201,162,255,${(1-age)*.8})`;ctx.lineWidth=(1-age)*16*S+2;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${1-age})`;ctx.lineWidth=(1-age)*6*S+1;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();}
    ctx.restore();
    if(mx>-50){
      ctx.save();ctx.translate(mx,my);ctx.rotate(T*(slicing?20:6));ctx.shadowColor='#d9a8ff';ctx.shadowBlur=14*S;ctx.fillStyle=slicing?'#ffffff':'#e6d2ff';
      for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(5*S,-5*S);ctx.lineTo(0,-18*S);ctx.lineTo(-5*S,-5*S);ctx.fill();}
      ctx.fillStyle='#4a2a6a';ctx.beginPath();ctx.arc(0,0,3*S,0,7);ctx.fill();ctx.restore();
      ctx.strokeStyle='rgba(201,162,255,.85)';ctx.lineWidth=3*S;ctx.beginPath();ctx.arc(mx,my,26*S,-Math.PI/2,-Math.PI/2+Math.PI*2*ninjaT/NINJA_TIME);ctx.stroke();
    }
  }
}

/* ---------- HUD / overlays ---------- */
function txt(s,x,y,size,color,align,weight){
  ctx.font=`${weight||800} ${Math.round(size)}px system-ui,-apple-system,Segoe UI,sans-serif`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size*.16);ctx.strokeStyle='rgba(0,20,40,.65)';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=color||'#fff';ctx.fillText(s,x,y);
}
function drawSkillIcon(sk,ix,iy,r){
  const lab=(t,c)=>txt(t,ix,iy-r-10*S-2,9*S+4,c,'center',800);
  ctx.fillStyle='rgba(0,20,40,.6)';ctx.beginPath();ctx.arc(ix,iy,r+3,0,7);ctx.fill();
  if(!sk.on){ctx.fillStyle='rgba(120,120,130,.6)';ctx.beginPath();ctx.arc(ix,iy,r,0,7);ctx.fill();
    txt(sk.unlock+'m',ix,iy,9*S+5,'#ccc','center',800);lab(sk.name,'rgba(255,255,255,.55)');return;}
  if(sk.active>0){
    ctx.fillStyle='rgba(80,40,110,.8)';ctx.beginPath();ctx.arc(ix,iy,r,0,7);ctx.fill();
    ctx.save();ctx.fillStyle=sk.col;ctx.shadowColor=sk.col;ctx.shadowBlur=12*S;ctx.beginPath();ctx.moveTo(ix,iy);
    ctx.arc(ix,iy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*sk.active/NINJA_TIME);ctx.closePath();ctx.fill();ctx.restore();
    txt(sk.active.toFixed(1),ix,iy,10*S+5,'#fff','center',800);lab('ACTIVE',sk.col);return;}
  if(sk.left<=0){ctx.save();ctx.fillStyle=sk.col;ctx.shadowColor=sk.col;ctx.shadowBlur=(10+6*Math.sin(T*5))*S;ctx.beginPath();ctx.arc(ix,iy,r,0,7);ctx.fill();ctx.restore();
    txt(sk.key,ix,iy,(sk.key.length>2?9:sk.key.length>1?11:16)*S+6,'#fff');lab(sk.name,sk.col);return;}
  ctx.fillStyle='rgba(60,50,70,.75)';ctx.beginPath();ctx.arc(ix,iy,r,0,7);ctx.fill();
  ctx.save();ctx.globalAlpha=.6;ctx.fillStyle=sk.col;ctx.beginPath();ctx.moveTo(ix,iy);
  ctx.arc(ix,iy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(1-sk.left/sk.cd,0,1));ctx.closePath();ctx.fill();ctx.restore();
  txt(Math.ceil(sk.left)+'m',ix,iy,9*S+5,'#fff','center',800);lab(sk.name,'rgba(255,255,255,.75)');
  if(sk.deny&&denyT>0){ctx.save();ctx.strokeStyle=`rgba(255,90,90,${denyT/.4})`;ctx.lineWidth=3*S;ctx.beginPath();ctx.arc(ix,iy,r+6*S*(1-denyT/.4)+3,0,7);ctx.stroke();ctx.restore();}
}
function drawHand(x,y,s){ // simple finger/touch-point glyph for the tutorial hint
  ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(255,255,255,.9)';ctx.strokeStyle='rgba(0,30,60,.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,10*s,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2*s;ctx.beginPath();ctx.arc(0,0,16*s+4*Math.sin(T*6),0,7);ctx.stroke();ctx.restore();
}
function drawHUD(){
  const top=SAFE.t,L=SAFE.l+16,bot=Math.max(SAFE.b,isTouch?14:0);
  txt(Math.floor(depth)+' m',W/2,top+40*S+10,46*S+10,'#fff');
  txt(ZONES[zoneIdx][1].toUpperCase(),W/2,top+82*S+18,12*S+6,'rgba(190,235,255,.9)','center',700);
  txt('BEST '+Math.floor(best)+' m',L,top+24,12*S+6,'#ffe27a','left',800);
  txt('SINK '+speedNow.toFixed(1)+' m/s',L,top+24+20*S+10,11*S+5,boosting?'#7ff7ff':'rgba(255,255,255,.75)','left',700);
  if(!isTouch)txt(muted?'M: sound off':'M: sound on',W-12,22,10*S+5,'rgba(255,255,255,.55)','right',600);
  if(state==='play'&&ninjaT>0)txt('WORM NINJA  '+ninjaT.toFixed(1)+'s',W/2,top+112*S+26,16*S+6,'#c9a2ff');
  if(state==='play'&&drilling){
    const bw2=Math.min(220,W*.55),bx2=W/2-bw2/2,by2=top+104*S+22,p=clamp((depth-drillStart)/Math.max(1,drillTarget-drillStart),0,1);
    ctx.fillStyle='rgba(0,20,40,.6)';roundRect(bx2-3,by2-3,bw2+6,14,7);ctx.fill();
    ctx.fillStyle='#ffc23a';roundRect(bx2,by2,Math.max(8,bw2*p),8,4);ctx.fill();
    txt('WORM DRILL  '+Math.floor(depth)+' / '+drillTarget+' m',W/2,by2+24,12*S+6,'#ffd84a');
  }
  if(runDrills>0){ // drills collected this run
    const yy=top+24+2*(20*S+10),im=SPR.drill;
    if(im&&im.ready){const h=20;ctx.drawImage(im,L,yy-h/2,h/im.ar,h);}
    txt('×'+runDrills+'  (+'+runDrills*DRILL_M+' m)',L+18,yy,11*S+5,'#ffd84a','left',800);
  }
  if(state==='play'){
    iconHits=[];
    const r=isTouch?Math.max(22,18*S+5):18*S+5,gap=isTouch?12:14*S;
    const bw=Math.min(220*S+40,W-SAFE.l-SAFE.r-(3*2*r+2*gap+20*S)-24),bh=12*S+4;
    const total=bw+20*S+3*2*r+2*gap,bx=W/2-total/2,by=H-34*S-14-bot;
    txt(exhausted?'RECHARGING...':isTouch?'BURST  (drag down)':'BURST  [hold SPACE]',bx+bw/2,by-14*S-4,11*S+5,exhausted?'#ff8a8a':'rgba(255,255,255,.85)','center',700);
    ctx.fillStyle='rgba(0,20,40,.6)';roundRect(bx-3,by-3,bw+6,bh+6,(bh+6)/2);ctx.fill();
    if(stam>0){ctx.fillStyle=exhausted?'#ff6b6b':boosting?'#7ff7ff':'#3fc6e8';
      if(boosting){ctx.shadowColor='#7ff7ff';ctx.shadowBlur=12*S;}
      roundRect(bx,by,Math.max(bh,bw*stam),bh,bh/2);ctx.fill();ctx.shadowBlur=0;}
    const skills=[
      {name:'SLICE',key:isTouch?'TAP':'W',col:'#ff9de0',on:sliceOn,unlock:SLICE_UNLOCK,left:sliceReady-depth,cd:SLICE_COOLDOWN,act:()=>trySlice(true),deny:true},
      {name:'NINJA',key:isTouch?'×2':'E',col:'#c9a2ff',on:ninjaOn,unlock:NINJA_UNLOCK,left:ninjaReady-depth,cd:NINJA_COOLDOWN,act:tryNinja,active:ninjaT,deny:true},
      {name:'PUNCH',key:'AUTO',col:'#ffb347',on:punchOn,unlock:PUNCH_UNLOCK,left:punchReady-depth,cd:PUNCH_COOLDOWN},
    ];
    skills.forEach((sk,i)=>{const ix=bx+bw+20*S+r+i*(2*r+gap),iy=by+bh/2;drawSkillIcon(sk,ix,iy,r);
      if(sk.act&&sk.on)iconHits.push({x:ix,y:iy,r,act:sk.act});});
    // first few seconds on touch: show how to steer
    if(isTouch&&hintT<5&&dragTarget===null&&ninjaT<=0&&!drilling){
      const a=Math.min(1,hintT*2,(5-hintT)),y=Math.min(H*.68,by-100),sx=W/2+Math.sin(T*2.4)*W*.22;
      ctx.save();ctx.globalAlpha=a*.85;
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(W*.28,y);ctx.lineTo(W*.72,y);ctx.stroke();ctx.setLineDash([]);
      drawHand(sx,y,1);txt("Hold & drag to steer",W/2,y+32,15*S+8,'#fff','center',700);ctx.restore();
    }
  }
  if(state==='dead'&&deathT>.3&&!reelDone){const p=clamp((deathT-.3)/.25,0,1);
    txt('YOINK!',W/2,H*.62,(70-25*p)*S+14,'#ffd84a');
    if(deathT>.6){ctx.globalAlpha=.6;txt(isTouch?'Tap to skip':'Space / tap to skip',W-SAFE.r-12,H-bot-18,11*S+5,'#fff','right',600);ctx.globalAlpha=1;}}
  if(banner){const a=banner.t<.4?banner.t/.4:banner.t>2.8?Math.max(0,(3.4-banner.t)/.6):1;
    ctx.globalAlpha=a;fitTxt(banner.text,W/2,H*.5,(banner.skill?24:30)*S+10,banner.warn?'#ff6b6b':banner.col||'#bff3ff');
    if(banner.sub)fitTxt(banner.sub,W/2,H*.5+30*S+12,13*S+6,'rgba(255,255,255,.9)',600);ctx.globalAlpha=1;}
}
// shrink text to fit narrow (portrait) screens
function fitTxt(s,x,y,size,color,weight){
  ctx.font=`${weight||800} ${Math.round(size)}px system-ui,-apple-system,Segoe UI,sans-serif`;
  const w=ctx.measureText(s).width,max=W-SAFE.l-SAFE.r-24;txt(s,x,y,w>max?size*max/w:size,color,'center',weight);
}
function drawTitle(){
  ctx.fillStyle='rgba(0,20,40,.25)';ctx.fillRect(0,0,W,H);
  // on short screens (address bar showing, landscape phones) pull the text block up so it all fits
  const ty=Math.min(H*.6,H-SAFE.b-(isTouch?250:200)*S-60);
  fitTxt('WORM ON A HOOK',W/2,ty,58*S+12,'#ffd84a');
  fitTxt('You are the bait. Do not get eaten.',W/2,ty+50*S+14,18*S+6,'#fff',700);
  if(drillBank>0){
    const im=SPR.drill,yy=ty-62*S-16,h=26;
    fitTxt('WORM DRILL ×'+drillBank+' READY  ·  you start at '+drillBank*DRILL_M+' m',W/2+12,yy,15*S+6,'#ffd84a');
    if(im&&im.ready){ctx.font=`800 ${Math.round(15*S+6)}px system-ui`;const tw=Math.min(ctx.measureText('WORM DRILL ×'+drillBank+' READY  ·  you start at '+drillBank*DRILL_M+' m').width,W-40);
      ctx.drawImage(im,W/2+12-tw/2-h/im.ar-8,yy-h/2,h/im.ar,h);}
  }
  ctx.globalAlpha=.6+.4*Math.sin(T*4);
  fitTxt(isTouch?'Tap to get cast':'Press SPACE or tap to get cast',W/2,ty+95*S+26,20*S+8,'#bff3ff');ctx.globalAlpha=1;
  if(isTouch){
    fitTxt('Drag to steer  ·  drag down to burst',W/2,ty+132*S+34,13*S+5,'rgba(255,255,255,.85)',600);
    const sk=['Quick tap: Worm Slice ('+SLICE_UNLOCK+' m)','Two-finger tap: Worm Ninja ('+NINJA_UNLOCK+' m)','Worm Punch is automatic ('+PUNCH_UNLOCK+' m)'];
    sk.forEach((l,i)=>fitTxt(l,W/2,ty+158*S+40+i*(15*S+10),13*S+5,'rgba(255,220,240,.9)',600));
    if(best>0)fitTxt('Best depth: '+Math.floor(best)+' m',W/2,ty+158*S+40+3*(15*S+10)+8,14*S+6,'#ffe27a',700);
    return;
  }
  fitTxt('A / D, ← / → or drag  ·  hold SPACE to burst',W/2,ty+132*S+34,13*S+5,'rgba(255,255,255,.85)',600);
  fitTxt('Skills:  W or click: slice ('+SLICE_UNLOCK+' m)  ·  E: ninja ('+NINJA_UNLOCK+' m)  ·  auto punch ('+PUNCH_UNLOCK+' m)',W/2,ty+156*S+40,13*S+5,'rgba(255,220,240,.85)',600);
  if(best>0)fitTxt('Best depth: '+Math.floor(best)+' m',W/2,ty+184*S+48,14*S+6,'#ffe27a',700);
}
function drawDead(){
  const a=clamp((deathT-REEL_END-.2)/.5,0,1);if(a<=0)return;
  ctx.fillStyle=`rgba(0,0,0,${.5*a})`;ctx.fillRect(0,0,W,H);ctx.globalAlpha=a;
  const portrait=H>W,cx=portrait?W/2:W*.58;
  const cy=portrait?Math.min(H*.62,H-SAFE.b-245*S-60):Math.min(H*.4,H-SAFE.b-245*S-60);
  const T2=(s,y,sz,c,w)=>{ctx.font=`${w||800} ${Math.round(sz)}px system-ui`;const mw=ctx.measureText(s).width,max=portrait?W-SAFE.l-SAFE.r-24:W*.8;txt(s,cx,y,mw>max?sz*max/mw:sz,c,'center',w);};
  T2('CAUGHT!',cy-70*S,64*S+14,'#ff6b6b');
  T2('Eaten by '+killer.t.name+', then reeled in',cy,20*S+8,'#fff');
  T2(QUIPS[killer.t.id]||'',cy+32*S+8,15*S+6,'rgba(255,255,255,.75)',600);
  T2(Math.floor(depth)+' m',cy+90*S+14,52*S+12,'#bff3ff');
  T2(newBest?'NEW BEST!':'Best: '+Math.floor(best)+' m',cy+140*S+22,18*S+6,'#ffe27a');
  T2(runDrills>0?'Worm Drills ×'+runDrills+'  →  next run starts at '+runDrills*DRILL_M+' m':'No Worm Drills collected (one every '+DRILL_EVERY+' m)',cy+172*S+30,14*S+6,runDrills>0?'#ffd84a':'rgba(255,255,255,.6)',700);
  if(deathT>REEL_END+.8){ctx.globalAlpha=a*(.6+.4*Math.sin(T*4));T2(isTouch?'Tap to try again':'Press SPACE or tap to try again',cy+212*S+40,18*S+6,'#fff');}
  ctx.globalAlpha=1;
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);
  const wantCur=(state==='play'&&ninjaT>0)?'none':'default';if(wantCur!==curCursor){curCursor=wantCur;cv.style.cursor=wantCur;}
  ctx.save();
  if(shake>0)ctx.translate(rand(-1,1)*shake*12*S,rand(-1,1)*shake*12*S);
  if(state==='title')drawSurfaceScene(0,true);
  else if(state==='intro')drawSurfaceScene(introT,false);
  else if(state==='dead'&&reelDone)drawSurfaceScene(0,true,killer);
  else drawPlay();
  ctx.restore();
  if(flash>0){ctx.fillStyle=reelDone?`rgba(255,255,255,${flash*.6})`:`rgba(255,40,40,${flash*.35})`;ctx.fillRect(0,0,W,H);}
  if(state==='title')drawTitle();
  else if(state==='intro'){if(introT>.3){ctx.globalAlpha=.6;txt(isTouch?'Tap to skip':'Space / tap to skip',W-SAFE.r-12,H-SAFE.b-18,11*S+5,'#fff','right',600);ctx.globalAlpha=1;}}
  else{if(!reelDone)drawHUD();if(state==='dead')drawDead();}
  if(state!=='play')drawFSButton();else fsBtn=null;
  requestAnimationFrame(frame);
}
resize();hx=W/2;
requestAnimationFrame(frame);
})();
</script>
